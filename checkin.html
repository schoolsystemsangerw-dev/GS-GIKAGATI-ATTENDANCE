<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Attendance Check-In | GS Gikagati</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header Section -->
    <header class="bg-slate-800 border-b border-slate-700 py-6 px-4 shadow-md">
        <div class="max-w-xl mx-auto text-center">
            <h1 class="text-2xl font-bold tracking-wide text-amber-400 uppercase">GS Gikagati</h1>
            <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest">Staff Attendance Portal</p>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-xl w-full mx-auto p-4 flex-grow flex flex-col justify-center">
        <div class="bg-slate-800/85 backdrop-blur border border-slate-700 rounded-xl p-6 shadow-xl">
            
            <h2 class="text-lg font-semibold text-center text-slate-200 mb-6">Daily Verification & Sign-In</h2>

            <!-- Action Type Selection -->
            <div class="mb-4">
                <label class="block text-xs font-medium text-slate-400 uppercase mb-2">Select Action</label>
                <div class="grid grid-cols-2 gap-4">
                    <button type="button" id="btnCheckIn" class="py-2.5 px-4 rounded-lg font-semibold text-sm border border-emerald-500 bg-emerald-500/20 text-emerald-400 transition">Check In</button>
                    <button type="button" id="btnCheckOut" class="py-2.5 px-4 rounded-lg font-semibold text-sm border border-slate-600 text-slate-400 hover:border-amber-500 hover:text-amber-400 transition">Check Out</button>
                </div>
            </div>

            <!-- Staff Name Selector (Displays names only) -->
            <div class="mb-4">
                <label for="staffSelect" class="block text-xs font-medium text-slate-400 uppercase mb-2">Choose Your Name</label>
                <select id="staffSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-amber-400">
                    <option value="">-- Loading Staff Records --</option>
                </select>
            </div>

            <!-- SDMS Password Input -->
            <div class="mb-4">
                <label for="sdmsPassword" class="block text-xs font-medium text-slate-400 uppercase mb-2">Enter SDMS ID (Password)</label>
                <input type="password" id="sdmsPassword" placeholder="Enter your secret SDMS ID" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-amber-400">
            </div>

            <!-- Live Photo Verification -->
            <div class="mb-6">
                <label class="block text-xs font-medium text-slate-400 uppercase mb-2">Live Photo Verification</label>
                <div class="relative bg-slate-900 border border-slate-700 rounded-lg overflow-hidden flex flex-col items-center justify-center p-2">
                    <video id="videoElement" autoplay playsinline class="w-full h-48 object-cover rounded-lg bg-black"></video>
                    <canvas id="canvasElement" class="hidden"></canvas>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="button" id="submitBtn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg shadow-lg transition">
                Submit Attendance Record
            </button>

            <!-- Status Message -->
            <p id="statusMsg" class="mt-4 text-center text-xs font-semibold"></p>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-4 text-center text-xs text-slate-400">
        <p>&copy; 2026 GS Gikagati. All rights reserved. | Powered by Government of Rwanda</p>
    </footer>

    <!-- Script Logic using ESM Supabase Client -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // Supabase Initialization with your exact credentials
        const SUPABASE_URL = 'https://qjqljvppfhsszvsuhvzo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_b2zYmY5IaM7_quyh3yfQ-A_aACGNTfq';
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let actionType = 'Check In';

        const btnCheckIn = document.getElementById('btnCheckIn');
        const btnCheckOut = document.getElementById('btnCheckOut');
        const staffSelect = document.getElementById('staffSelect');
        const sdmsPassword = document.getElementById('sdmsPassword');
        const videoElement = document.getElementById('videoElement');
        const canvasElement = document.getElementById('canvasElement');
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');

        // Toggle Action Type
        btnCheckIn.addEventListener('click', () => {
            actionType = 'Check In';
            btnCheckIn.className = 'py-2.5 px-4 rounded-lg font-semibold text-sm border border-emerald-500 bg-emerald-500/20 text-emerald-400 transition';
            btnCheckOut.className = 'py-2.5 px-4 rounded-lg font-semibold text-sm border border-slate-600 text-slate-400 hover:border-amber-500 hover:text-amber-400 transition';
        });

        btnCheckOut.addEventListener('click', () => {
            actionType = 'Check Out';
            btnCheckOut.className = 'py-2.5 px-4 rounded-lg font-semibold text-sm border border-amber-500 bg-amber-500/20 text-amber-400 transition';
            btnCheckIn.className = 'py-2.5 px-4 rounded-lg font-semibold text-sm border border-slate-600 text-slate-400 hover:border-emerald-500 hover:text-emerald-400 transition';
        });

        // Load Staff Records into Dropdown (Displaying names only, storing SDMS ID as value)
        async function loadStaff() {
            try {
                const { data, error } = await supabaseClient.from('staffs').select('name, sdms_id');
                if (error) throw error;

                staffSelect.innerHTML = '<option value="">-- Select Your Name --</option>';
                data.forEach(staff => {
                    const option = document.createElement('option');
                    option.value = staff.sdms_id;
                    option.textContent = staff.name;
                    staffSelect.appendChild(option);
                });
            } catch (err) {
                staffSelect.innerHTML = '<option value="">-- Error Loading Staff --</option>';
                console.error(err);
            }
        }

        // Initialize Camera Stream
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                videoElement.srcObject = stream;
            } catch (err) {
                console.error("Camera access denied or unavailable:", err);
                statusMsg.textContent = "Warning: Camera access is required for verification.";
                statusMsg.className = "mt-4 text-center text-xs font-semibold text-amber-400";
            }
        }

        loadStaff();
        initCamera();

        // Submit Attendance Record & Validate Password
        submitBtn.addEventListener('click', async () => {
            const selectedSdms = staffSelect.value;
            const passwordInput = sdmsPassword.value.trim();

            if (!selectedSdms) {
                statusMsg.textContent = "Error: Please select your name from the list.";
                statusMsg.className = "mt-4 text-center text-xs font-semibold text-rose-400";
                return;
            }

            if (passwordInput !== selectedSdms) {
                statusMsg.textContent = "Error: Incorrect SDMS ID password.";
                statusMsg.className = "mt-4 text-center text-xs font-semibold text-rose-400";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Verifying & Recording...";

            try {
                // Capture Snapshot from Video Stream
                const context = canvasElement.getContext('2d');
                canvasElement.width = videoElement.videoWidth || 320;
                canvasElement.height = videoElement.videoHeight || 240;
                context.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);

                // Get current date in YYYY-MM-DD format and exact timestamp
                const todayDate = new Date().toISOString().split('T')[0];

                const { error: insertError } = await supabaseClient
                    .from('attendances')
                    .insert([{
                        sdms_id: selectedSdms,
                        status: actionType,
                        date: todayDate,
                        created_at: new Date().toISOString()
                    }]);

                if (insertError) throw insertError;

                statusMsg.className = 'mt-4 text-center text-xs font-semibold text-emerald-400';
                statusMsg.textContent = `Success! Recorded ${actionType} at ${new Date().toLocaleTimeString()}.`;

                setTimeout(() => { location.reload(); }, 3000);

            } catch (err) {
                statusMsg.className = 'mt-4 text-center text-xs font-semibold text-rose-400';
                statusMsg.textContent = `Error: ${err.message}`;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Attendance Record';
            }
        });
    </script>
</body>
</html>
