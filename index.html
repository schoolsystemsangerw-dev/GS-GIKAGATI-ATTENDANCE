<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS Gikagati - Master Control Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased">
    <div class="flex h-screen overflow-hidden">
        <!-- Left Sidebar -->
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col border-r border-slate-800">
            <div class="p-6 border-b border-slate-800">
                <h1 class="text-lg font-bold text-white tracking-wide">GS GIKAGATI</h1>
                <p class="text-xs text-slate-400 mt-1">Master Control Portal</p>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2">
                <button onclick="switchView('dashboard')" class="w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium bg-slate-800 text-white transition">Dashboard</button>
                <button onclick="switchView('ontime')" class="w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800/60 transition">On-Time Check-Ins</button>
                <button onclick="switchView('late')" class="w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800/60 transition">Late Arrivals</button>
                <button onclick="switchView('checkouts')" class="w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800/60 transition">Check-Out Logs</button>
                <button onclick="switchView('dailylogs')" class="w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800/60 transition">Daily Logs By Weekday</button>
                <button onclick="switchView('leavepermit')" class="w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800/60 transition flex items-center justify-between">
                    <span>Leave Permits</span>
                    <span class="bg-amber-500/20 text-amber-400 text-[10px] font-bold px-2 py-0.5 rounded">New</span>
                </button>
            </nav>
            <div class="p-4 border-t border-slate-800 text-xs text-slate-500 text-center">
                Karama Sector, Nyagatare
            </div>
        </aside>

        <!-- Main Content Wrapper -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- Top Navbar -->
            <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 z-10">
                <div>
                    <h2 id="view-title" class="text-xl font-bold text-slate-900">Dashboard Overview</h2>
                    <p id="view-subtitle" class="text-xs text-slate-500">Real-time attendance tracking and monitoring</p>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="exportAttendancePDF()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition flex items-center space-x-2">
                        <span>Download PDF</span>
                    </button>
                    <button onclick="sendOfficialReport()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition flex items-center space-x-2">
                        <span>Send Official Report</span>
                    </button>
                </div>
            </header>

            <!-- Dashboard Content Area -->
            <div class="flex-1 overflow-y-auto p-8 bg-slate-50">
                <div id="content-container">
                    <!-- Dynamic view content injected here -->
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Staff</p>
                            <h3 id="stat-total" class="text-3xl font-extrabold text-slate-900 mt-2">-</h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Present On Time</p>
                            <h3 id="stat-ontime" class="text-3xl font-extrabold text-emerald-600 mt-2">-</h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Late Arrivals</p>
                            <h3 id="stat-late" class="text-3xl font-extrabold text-rose-600 mt-2">-</h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Absent / Pending</p>
                            <h3 id="stat-absent" class="text-3xl font-extrabold text-amber-600 mt-2">-</h3>
                        </div>
                    </div>
                </div>

                <!-- Table Section -->
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                        <h3 class="font-bold text-slate-900">Attendance Records</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr id="table-header-row" class="bg-slate-50 text-slate-500 font-semibold text-xs uppercase tracking-wider border-b border-slate-200">
                                    <th class="py-3 px-4">SDMS ID</th>
                                    <th class="py-3 px-4">Staff Name</th>
                                    <th class="py-3 px-4">Position</th>
                                    <th class="py-3 px-4">Role</th>
                                    <th class="py-3 px-4">Today's Status</th>
                                </tr>
                            </thead>
                            <tbody id="table-body" class="divide-y divide-slate-100">
                                <tr>
                                    <td colspan="5" class="py-8 text-center text-slate-400 font-medium">Loading attendance data...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        let cachedStaff = [];
        let cachedAttendances = [];
        let staffLookup = {};
        let currentView = 'dashboard';

        // Load data from mock/API sources or initialize state
        function loadDashboardData() {
            // Simulated data structure initialization to maintain full standalone capability
            cachedStaff = [
                { sdms_id: 'SDMS001', first_name: 'Ladislas', last_name: '', position_name: 'Head Teacher', system_role: 'Administrator' },
                { sdms_id: 'SDMS002', first_name: 'Jean', last_name: 'Bosco', position_name: 'Teacher', system_role: 'Staff' }
            ];
            cachedAttendances = [
                { sdms_id: 'SDMS001', status: 'check-in', date: new Date().toISOString().split('T')[0], created_at: new Date().toISOString() }
            ];

            cachedStaff.forEach(s => {
                staffLookup[s.sdms_id] = `${s.first_name || ''} ${s.last_name || ''}`.trim();
            });

            renderCurrentView();
        }

        function switchView(viewName) {
            currentView = viewName;
            renderCurrentView();
        }

        function renderCurrentView() {
            const titleElem = document.getElementById('view-title');
            const subtitleElem = document.getElementById('view-subtitle');
            const headerRow = document.getElementById('table-header-row');
            const tableBody = document.getElementById('table-body');
            const container = document.getElementById('content-container');

            // Handle Leave Permits Custom View
            if (currentView === 'leavepermit') {
                titleElem.textContent = "Leave Permits Management";
                subtitleElem.textContent = "Manage staff leave applications and authorized permissions";
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm mb-6 flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-slate-900">Active Leave Requests</h3>
                            <p class="text-xs text-slate-500">Review or grant permission slips for school staff</p>
                        </div>
                        <button onclick="alert('Leave application modal feature placeholder')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                            + New Leave Request
                        </button>
                    </div>
                `;
                headerRow.innerHTML = `
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Leave Type</th>
                    <th class="py-3 px-4">Duration</th>
                    <th class="py-3 px-4">Approval Status</th>
                `;
                tableBody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400 font-medium">No active leave permits recorded.</td></tr>`;
                return;
            }

            // Reset dashboard stats block if not on dashboard view
            if (currentView === 'dashboard') {
                container.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Staff</p>
                            <h3 id="stat-total" class="text-3xl font-extrabold text-slate-900 mt-2">${cachedStaff.length}</h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Present On Time</p>
                            <h3 id="stat-ontime" class="text-3xl font-extrabold text-emerald-600 mt-2">-</h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Late Arrivals</p>
                            <h3 id="stat-late" class="text-3xl font-extrabold text-rose-600 mt-2">-</h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Absent / Pending</p>
                            <h3 id="stat-absent" class="text-3xl font-extrabold text-amber-600 mt-2">-</h3>
                        </div>
                    </div>
                `;

                titleElem.textContent = "Dashboard Overview";
                subtitleElem.textContent = "Real-time attendance tracking and monitoring";
                headerRow.innerHTML = `
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Position</th>
                    <th class="py-3 px-4">Role</th>
                    <th class="py-3 px-4">Today's Status</th>
                `;

                const todayString = new Date().toISOString().split('T')[0];
                let presentCount = 0;
                let lateCount = 0;
                let tableDataHTML = '';

                cachedStaff.forEach(staff => {
                    const name = `${staff.first_name || ''} ${staff.last_name || ''}`.trim() || '-';
                    const record = cachedAttendances.find(r => r.date === todayString && r.sdms_id === staff.sdms_id);
                    let statusText = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-amber-50 text-amber-700 border border-amber-200">Pending / Absent</span>';

                    if (record) {
                        if (record.status === 'check-out') {
                            statusText = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-blue-50 text-blue-700 border border-blue-200">Checked Out</span>';
                            presentCount++;
                        } else if (record.status === 'check-in' && record.created_at) {
                            presentCount++;
                            const checkInDate = new Date(record.created_at);
                            const totalMinutes = checkInDate.getHours() * 60 + checkInDate.getMinutes();
                            if (totalMinutes > (7 * 60 + 30)) {
                                lateCount++;
                                statusText = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-rose-50 text-rose-700 border border-rose-200">Late (${checkInDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})})</span>`;
                            } else {
                                statusText = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-emerald-50 text-emerald-700 border border-emerald-200">On Time (${checkInDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})})</span>`;
                            }
                        }
                    }

                    tableDataHTML += `
                        <tr class="hover:bg-slate-50/80 transition duration-150">
                            <td class="py-3 px-4 font-mono font-bold text-slate-800">${staff.sdms_id || '-'}</td>
                            <td class="py-3 px-4 font-semibold text-slate-900">${name}</td>
                            <td class="py-3 px-4 text-slate-600">${staff.position_name || '-'}</td>
                            <td class="py-3 px-4 text-slate-600">${staff.system_role || '-'}</td>
                            <td class="py-3 px-4">${statusText}</td>
                        </tr>
                    `;
                });

                tableBody.innerHTML = tableDataHTML;
                document.getElementById('stat-ontime').textContent = presentCount - lateCount;
                document.getElementById('stat-late').textContent = lateCount;
                document.getElementById('stat-absent').textContent = cachedStaff.length - presentCount;
                return;
            }

            // Views: ontime, late, checkouts, dailylogs
            container.innerHTML = '';
            if (currentView === 'ontime' || currentView === 'late') {
                titleElem.textContent = currentView === 'ontime' ? "On-Time Check-In Logs" : "Late Arrival Logs";
                subtitleElem.textContent = "Filtered view based on the 07:30 AM arrival rule";
                headerRow.innerHTML = `
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Status</th>
                    <th class="py-3 px-4">Date</th>
                    <th class="py-3 px-4">Exact Time</th>
                `;

                let logs = cachedAttendances.filter(r => r.status === 'check-in');
                if (currentView === 'ontime') {
                    logs = logs.filter(r => {
                        if (!r.created_at) return false;
                        const d = new Date(r.created_at);
                        return (d.getHours() * 60 + d.getMinutes()) <= (7 * 60 + 30);
                    });
                } else {
                    logs = logs.filter(r => {
                        if (!r.created_at) return false;
                        const d = new Date(r.created_at);
                        return (d.getHours() * 60 + d.getMinutes()) > (7 * 60 + 30);
                    });
                }

                if (logs.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400 font-medium">No check-in entries found matching this criterion.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                logs.forEach(record => {
                    const name = staffLookup[record.sdms_id] || 'Unknown Staff';
                    const timeFormatted = record.created_at ? new Date(record.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}) : '-';
                    let statusBadge = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-emerald-50 text-emerald-700 border border-emerald-200">On Time</span>';
                    if (record.created_at) {
                        const checkInDate = new Date(record.created_at);
                        if ((checkInDate.getHours() * 60 + checkInDate.getMinutes()) > (7 * 60 + 30)) {
                            statusBadge = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-rose-50 text-rose-700 border border-rose-200">Late</span>';
                        }
                    }
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-50/80 transition duration-150';
                    row.innerHTML = `
                        <td class="py-3 px-4 font-mono font-bold text-slate-800">${record.sdms_id || '-'}</td>
                        <td class="py-3 px-4 font-semibold text-slate-900">${name}</td>
                        <td class="py-3 px-4">${statusBadge}</td>
                        <td class="py-3 px-4 text-slate-600 font-mono">${record.date || '-'}</td>
                        <td class="py-3 px-4 text-slate-600 font-mono">${timeFormatted}</td>
                    `;
                    tableBody.appendChild(row);
                });
            } else if (currentView === 'checkouts') {
                titleElem.textContent = "All Check-Out Logs";
                subtitleElem.textContent = "Complete chronological history of staff check-out submissions";
                headerRow.innerHTML = `
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Status Action</th>
                    <th class="py-3 px-4">Date</th>
                    <th class="py-3 px-4">Exact Time</th>
                `;
                const checkoutLogs = cachedAttendances.filter(r => r.status === 'check-out');
                if (checkoutLogs.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400 font-medium">No check-out records found.</td></tr>`;
                    return;
                }
                tableBody.innerHTML = '';
                checkoutLogs.forEach(record => {
                    const name = staffLookup[record.sdms_id] || 'Unknown Staff';
                    const timeFormatted = record.created_at ? new Date(record.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}) : '-';
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-50/80 transition duration-150';
                    row.innerHTML = `
                        <td class="py-3 px-4 font-mono font-bold text-slate-800">${record.sdms_id || '-'}</td>
                        <td class="py-3 px-4 font-semibold text-slate-900">${name}</td>
                        <td class="py-3 px-4"><span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-blue-50 text-blue-700 border border-blue-200">Check-Out</span></td>
                        <td class="py-3 px-4 text-slate-600 font-mono">${record.date || '-'}</td>
                        <td class="py-3 px-4 text-slate-600 font-mono">${timeFormatted}</td>
                    `;
                    tableBody.appendChild(row);
                });
            } else if (currentView === 'dailylogs') {
                titleElem.textContent = "Daily Logs By Weekday";
                subtitleElem.textContent = "Grouped day-by-day logs with clear visual separation between different days";
                headerRow.innerHTML = `
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Action Type</th>
                    <th class="py-3 px-4">Date / Weekday</th>
                    <th class="py-3 px-4">Status / Time</th>
                `;
                if (cachedAttendances.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400 font-medium">No attendance logs available.</td></tr>`;
                    return;
                }
                tableBody.innerHTML = '';
                const groupedByDate = {};
                cachedAttendances.forEach(record => {
                    const recordDateStr = record.date || (record.created_at ? record.created_at.split('T')[0] : 'Unknown Date');
                    if (!groupedByDate[recordDateStr]) groupedByDate[recordDateStr] = [];
                    groupedByDate[recordDateStr].push(record);
                });
                const sortedDates = Object.keys(groupedByDate).sort((a, b) => new Date(b) - new Date(a));
                sortedDates.forEach((dateStr, index) => {
                    const dateObj = new Date(dateStr + 'T00:00:00');
                    const weekdayName = !isNaN(dateObj) ? dateObj.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' }) : dateStr;
                    const separatorRow = document.createElement('tr');
                    const topMarginClass = index > 0 ? 'border-t-4 border-slate-200' : '';
                    separatorRow.className = `bg-slate-100 font-bold text-slate-900 ${topMarginClass}`;
                    separatorRow.innerHTML = `
                        <td colspan="5" class="py-3 px-4 text-xs uppercase tracking-wider text-blue-950 flex items-center space-x-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span>
                            <span>📅 Date Group: ${weekdayName} (${dateStr})</span>
                        </td>
                    `;
                    tableBody.appendChild(separatorRow);
                    groupedByDate[dateStr].forEach(record => {
                        const name = staffLookup[record.sdms_id] || 'Unknown Staff';
                        const timeFormatted = record.created_at ? new Date(record.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}) : '-';
                        let badge = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-slate-100 text-slate-700 border border-slate-200">-</span>';
                        if (record.status === 'check-in') {
                            if (record.created_at) {
                                const checkInDate = new Date(record.created_at);
                                if ((checkInDate.getHours() * 60 + checkInDate.getMinutes()) > (7 * 60 + 30)) {
                                    badge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-rose-50 text-rose-700 border border-rose-200">Late (${timeFormatted})</span>`;
                                } else {
                                    badge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-emerald-50 text-emerald-700 border border-emerald-200">On Time (${timeFormatted})</span>`;
                                }
                            } else {
                                badge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-emerald-50 text-emerald-700 border border-emerald-200">Check-In</span>`;
                            }
                        } else if (record.status === 'check-out') {
                            badge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-blue-50 text-blue-700 border border-blue-200">Check-Out (${timeFormatted})</span>`;
                        } else {
                            badge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-amber-50 text-amber-800 border border-amber-200">${record.status || 'Unknown'} (${timeFormatted})</span>`;
                        }
                        const row = document.createElement('tr');
                        row.className = 'hover:bg-slate-50/80 transition duration-150';
                        row.innerHTML = `
                            <td class="py-3 px-4 font-mono font-bold text-slate-800">${record.sdms_id || '-'}</td>
                            <td class="py-3 px-4 font-semibold text-slate-900">${name}</td>
                            <td class="py-3 px-4 uppercase text-[11px] font-bold text-slate-700">${record.status || '-'}</td>
                            <td class="py-3 px-4 text-slate-600 font-mono">${record.date || '-'}</td>
                            <td class="py-3 px-4">${badge}</td>
                        `;
                        tableBody.appendChild(row);
                    });
                });
            }
        }

        function exportAttendancePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.text("GS GIKAGATI - OFFICIAL ATTENDANCE REPORT", 14, 20);
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text(`Generated on: ${new Date().toLocaleString()}`, 14, 28);
            doc.text("Location: East Province | Nyagatare District | Karama Sector", 14, 34);

            let tableData = [];
            const todayString = new Date().toISOString().split('T')[0];
            const todayMap = {};
            cachedAttendances.forEach(r => {
                if (r.date === todayString && r.sdms_id) {
                    todayMap[r.sdms_id] = r;
                }
            });

            cachedStaff.forEach(staff => {
                const fullName = `${staff.first_name || ''} ${staff.last_name || ''}`.trim() || '-';
                const record = todayMap[staff.sdms_id];
                let statusText = "Pending / Absent";
                if (record) {
                    if (record.status === 'check-out') {
                        statusText = "Checked Out";
                    } else if (record.status === 'check-in' && record.created_at) {
                        const checkInDate = new Date(record.created_at);
                        if ((checkInDate.getHours() * 60 + checkInDate.getMinutes()) > (7 * 60 + 30)) {
                            statusText = `Late (${checkInDate.toLocaleTimeString()})`;
                        } else {
                            statusText = `On Time (${checkInDate.toLocaleTimeString()})`;
                        }
                    }
                }
                tableData.push([
                    staff.sdms_id || '-',
                    fullName,
                    staff.position_name || '-',
                    staff.system_role || '-',
                    statusText
                ]);
            });

            doc.autoTable({
                startY: 42,
                head: [['SDMS ID', 'Staff Name', 'Position', 'Role', "Today's Status"]],
                body: tableData,
                theme: 'grid',
                headStyles: { fillColor: [15, 23, 42] },
                styles: { fontSize: 9 }
            });
            doc.save(`GS_Gikagati_Attendance_${todayString}.pdf`);
        }

        function sendOfficialReport() {
            const govEmail = prompt("Enter the official government destination email address:", "sector.karama@nyagatare.gov.rw");
            if (govEmail === null) return;
            if (!govEmail.trim() || !govEmail.includes("@") || !govEmail.includes(".")) {
                alert("Operation cancelled or invalid email format provided.");
                return;
            }

            const todayString = new Date().toISOString().split('T')[0];
            let presentCount = 0;
            let lateCount = 0;

            cachedStaff.forEach(staff => {
                const record = cachedAttendances.find(r => r.date === todayString && r.sdms_id === staff.sdms_id && r.status === 'check-in');
                if (record) {
                    presentCount++;
                    const checkInTime = new Date(record.created_at);
                    if ((checkInTime.getHours() * 60 + checkInTime.getMinutes()) > (7 * 60 + 30)) {
                        lateCount++;
                    }
                }
            });

            const absentCount = cachedStaff.length - presentCount;
            const subject = `Official Daily Attendance Report - GS Gikagati (${todayString})`;
            const body = 
                `OFFICIAL DAILY ATTENDANCE REPORT\n` +
                `----------------------------------------\n` +
                `Institution: GS Gikagati\n` +
                `Administrative Location: East Province | Nyagatare District | Karama Sector\n` +
                `Date of Report: ${todayString}\n\n` +
                `ATTENDANCE SUMMARY:\n` +
                `- Total Registered Staff: ${cachedStaff.length}\n` +
                `- Present On Time: ${presentCount - lateCount}\n` +
                `- Late Arrivals (> 07:30 AM): ${lateCount}\n` +
                `- Total Present: ${presentCount}\n` +
                `- Absent / Pending: ${absentCount}\n\n` +
                `----------------------------------------\n` +
                `Submitted via GS Gikagati Master Control Portal\n` +
                `Authorized by Head Teacher: Ladislas`;

            const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(govEmail.trim())}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            window.open(gmailUrl, '_blank');
        }

        window.onload = function() {
            loadDashboardData();
        };
    </script>
</body>
