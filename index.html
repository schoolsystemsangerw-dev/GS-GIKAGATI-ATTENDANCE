<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Head Teacher Master Control - GS Gikagati</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans">
    <div class="min-h-screen flex flex-col">
        <!-- Top Navigation -->
        <header class="bg-blue-900 text-white shadow-md py-4 px-6 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <img src="../gikagati.png" alt="Logo" class="w-10 h-10 object-contain bg-white rounded-full p-1">
                <div>
                    <h1 class="text-xl font-bold">GS GIKAGATI - Head Teacher Dashboard</h1>
                    <p class="text-xs text-blue-200">Master Control Panel | Welcome, Ladislas</p>
                </div>
            </div>
            <a href="../index.html" class="bg-blue-800 hover:bg-blue-700 text-xs px-4 py-2 rounded-lg font-semibold transition">Logout</a>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs font-bold text-slate-400 uppercase">Total Staff Members</p>
                    <h3 class="text-3xl font-extrabold text-slate-800 mt-2">59</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs font-bold text-slate-400 uppercase">Present Today</p>
                    <h3 class="text-3xl font-extrabold text-green-600 mt-2" id="presentCount">-</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs font-bold text-slate-400 uppercase">Absent / Pending</p>
                    <h3 class="text-3xl font-extrabold text-red-600 mt-2" id="absentCount">-</h3>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h3 class="text-lg font-bold text-slate-800 mb-4">Master Staff Attendance Overview</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-200 text-xs text-slate-400 uppercase">
                                <th class="py-3 px-4">SDMS ID</th>
                                <th class="py-3 px-4">Staff Name</th>
                                <th class="py-3 px-4">Position</th>
                                <th class="py-3 px-4">Role</th>
                                <th class="py-3 px-4">Status</th>
                            </tr>
                        </thead>
                        <tbody id="staffTableBody" class="text-sm text-slate-600">
                            <tr>
                                <td colspan="5" class="py-4 text-center text-slate-400">Loading staff database from Supabase...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Supabase Connection using your project credentials
        const SUPABASE_URL = 'https://qjqljvppfhsszvsuhvzo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_b2zYmY5IaM7_quyh3yfQ-A_aACGNTfq';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadStaffAttendance() {
            const tableBody = document.getElementById('staffTableBody');
            
            // Fetch staff from your Supabase 'staff' table
            const { data, error } = await supabaseClient
                .from('staff')
                .select('*');

            if (error) {
                tableBody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-red-500">Error loading staff: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-slate-400">No staff members found in database.</td></tr>`;
                return;
            }

            // Populate the table dynamically with your staff records
            tableBody.innerHTML = '';
            data.forEach(staff => {
                const row = document.createElement('tr');
                row.className = 'border-b border-slate-100 hover:bg-slate-50';
                row.innerHTML = `
                    <td class="py-3 px-4 font-medium text-slate-800">${staff.sdms_id || '-'}</td>
                    <td class="py-3 px-4">${staff.name || '-'}</td>
                    <td class="py-3 px-4">${staff.position || '-'}</td>
                    <td class="py-3 px-4">${staff.role || '-'}</td>
                    <td class="py-3 px-4"><span class="px-2 py-1 bg-amber-100 text-amber-800 rounded text-xs font-semibold">Pending</span></td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Run when page loads
        loadStaffAttendance();
    </script>
</body>
</html>
