<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS Gikagati - Master Control Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- jsPDF & AutoTable for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/plugin.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- Top Navigation Header -->
    <header class="bg-slate-950 border-b border-slate-800 sticky top-0 z-30 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-amber-500 to-amber-600 flex items-center justify-center font-bold text-white shadow-lg shadow-amber-500/20">
                    GSG
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-wide">GS GIKAGATI MASTER PORTAL</h1>
                    <p class="text-xs text-slate-400">East Province | Nyagatare District | Karama Sector</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2 flex-wrap justify-center">
                <button onclick="switchView('dashboard')" id="nav-dashboard" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-slate-955 transition shadow">Dashboard</button>
                <button onclick="switchView('checkins')" id="nav-checkins" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Check-Ins</button>
                <button onclick="switchView('ontime')" id="nav-ontime" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">On Time</button>
                <button onclick="switchView('late')" id="nav-late" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Late Arrivals</button>
                <button onclick="switchView('checkouts')" id="nav-checkouts" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Check-Outs</button>
                <button onclick="switchView('dailylogs')" id="nav-dailylogs" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Daily Logs</button>
                <button onclick="switchView('leaves')" id="nav-leaves" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Leave Requests</button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 space-y-6">

        <!-- Action Bar & Controls -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-800/60 p-4 rounded-xl border border-slate-700 shadow-sm backdrop-blur">
            <div>
                <h2 id="view-title" class="text-xl font-bold text-white">Today's Attendance Status</h2>
                <p id="view-subtitle" class="text-xs text-slate-400">Real-time attendance record overview for staff members</p>
            </div>
            <div class="flex items-center space-x-3 flex-wrap gap-y-2">
                <button onclick="loadDashboardData()" class="px-3.5 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs font-semibold transition flex items-center space-x-1.5 shadow">
                    <span>🔄 Refresh Data</span>
                </button>
                <button onclick="openLeavePermitModal()" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold transition flex items-center space-x-1.5 shadow">
                    <span>📄 Issue Leave Permit</span>
                </button>
                <button onclick="exportAttendancePDF()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold transition flex items-center space-x-1.5 shadow">
                    <span>📥 Export PDF</span>
                </button>
                <button onclick="sendOfficialReport()" class="px-3.5 py-2 bg-amber-600 hover:bg-amber-500 text-slate-950 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 shadow">
                    <span>✉️ Send Government Report</span>
                </button>
            </div>
        </div>

        <!-- Data Table Card Container -->
        <div class="bg-white text-slate-900 rounded-xl shadow-xl overflow-hidden border border-slate-700">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr id="table-header-row" class="bg-slate-900 text-slate-100 text-xs uppercase tracking-wider">
                            <th class="py-3 px-4">SDMS ID</th>
                            <th class="py-3 px-4">Staff Name</th>
                            <th class="py-3 px-4">Position</th>
                            <th class="py-3 px-4">System Role</th>
                            <th class="py-3 px-4">Today's Status</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-200">
                        <!-- Dynamic rows injected here -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Leave Permit Modal Dialog -->
    <div id="leaveModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
        <div class="bg-slate-900 border border-slate-700 text-slate-100 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-lg text-amber-400">Generate Official Leave Permit</h3>
                <button onclick="closeLeavePermitModal()" class="text-slate-400 hover:text-white font-bold text-lg">&times;</button>
            </div>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold text-slate-300 mb-1">Select Staff Member</label>
                    <select id="leaveStaffSelect" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-amber-500"></select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">Start Date</label>
                        <input type="date" id="leaveStartDate" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-slate-200 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">End Date</label>
                        <input type="date" id="leaveEndDate" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-slate-200 focus:outline-none focus:border-amber-500">
                    </div>
                </div>
                <div>
                    <label class="block font-semibold text-slate-300 mb-1">Reason / Permit Category</label>
                    <textarea id="leaveReason" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-slate-200 focus:outline-none focus:border-amber-500" placeholder="e.g., Medical checkup, Official mission..."></textarea>
                </div>
            </div>

            <div class="flex justify-end space-x-3 pt-2 border-t border-slate-800">
                <button onclick="closeLeavePermitModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-semibold text-xs">Cancel</button>
                <button onclick="generateLeavePermitPDFDirect()" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-lg font-bold text-xs shadow">Download Permit PDF</button>
            </div>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        // Supabase Initialization Configuration
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let cachedStaff = [];
        let cachedAttendances = [];
        let cachedLeaves = [];
        let staffLookup = {};
        let currentView = 'dashboard';

        function switchView(viewName) {
            currentView = viewName;
            
            // Highlight active nav button
            ['dashboard', 'checkins', 'ontime', 'late', 'checkouts', 'dailylogs', 'leaves'].forEach(v => {
                const btn = document.getElementById(`nav-${v}`);
                if (btn) {
                    if (v === viewName) {
                        btn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-slate-955 transition shadow';
                    } else {
                        btn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition';
                    }
                }
            });

            renderCurrentViewData();
        }

        async function loadDashboardData() {
            try {
                // Fetch staff directory
                const { data: staffData, error: staffError } = await supabaseClient
                    .from('staff')
                    .select('*')
                    .order('sdms_id', { ascending: true });
                
                if (staffError) throw staffError;
                cachedStaff = staffData || [];

                staffLookup = {};
                cachedStaff.forEach(s => {
                    const name = `${s.first_name || ''} ${s.last_name || ''}`.trim() || 'Unknown';
                    staffLookup[s.sdms_id] = name;
                });

                // Fetch attendances log
                const { data: attData, error: attError } = await supabaseClient
                    .from('attendances')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (attError) throw attError;
                cachedAttendances = attData || [];

                // Fetch leave requests log
                const { data: leaveData, error: leaveError } = await supabaseClient
                    .from('leave_requests')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (!leaveError) {
                    cachedLeaves = leaveData || [];
                }

                renderCurrentViewData();
            } catch (err) {
                console.error("Error loading dashboard data:", err);
            }
        }

        function renderCurrentViewData() {
            const tableBody = document.getElementById('table-body');
            const headerRow = document.getElementById('table-header-row');
            const titleElem = document.getElementById('view-title');
            const subtitleElem = document.getElementById('view-subtitle');
            
            const todayString = new Date().toISOString().split('T')[0];

            if (currentView === 'dashboard') {
                titleElem.textContent = "Today's Attendance Status";
                subtitleElem.textContent = "Real-time attendance record overview for staff members";
                
                headerRow.innerHTML = `
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Position</th>
                    <th class="py-3 px-4">System Role</th>
                    <th class="py-3 px-4">Today's Status</th>
                `;

                const todayMap = {};
                cachedAttendances.forEach(r => {
                    if (r.date === todayString && r.sdms_id) {
                        todayMap[r.sdms_id] = r;
                    }
                });

                tableBody.innerHTML = '';
                cachedStaff.forEach(staff => {
                    const fullName = `${staff.first_name || ''} ${staff.last_name || ''}`.trim() || '-';
                    const record = todayMap[staff.sdms_id];
                    
                    let badge = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-amber-50 text-amber-800 border border-amber-200">Pending</span>';
                    
                    if (record) {
                        if (record.status === 'check-out') {
                            badge = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-blue-50 text-blue-700 border border-blue-200">Checked Out</span>';
                        } else if (record.status === 'check-in' && record.created_at) {
                            const checkInDate = new Date(record.created_at);
                            const totalMinutes = checkInDate.getHours() * 60 + checkInDate.getMinutes();
                            const cutoffMinutes = 7 * 60 + 30; // 7:30 AM limit
                            const timeFormatted = checkInDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                            
                            if (totalMinutes > cutoffMinutes) {
                                badge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-rose-50 text-rose-700 border border-rose-200">Late (${timeFormatted})</span>`;
                            } else {
                                badge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-emerald-50 text-emerald-700 border border-emerald-200">On Time (${timeFormatted})</span>`;
                            }
                        }
                    }

                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-50/80 transition duration-150';
                    row.innerHTML = `
                        <td class="py-3 px-4 font-mono font-bold text-slate-800">${staff.sdms_id || '-'}</td>
                        <td class="py-3 px-4 font-semibold text-slate-900">${fullName}</td>
                        <td class="py-3 px-4 text-slate-600">${staff.position_name || '-'}</td>
                        <td class="py-3 px-4"><span class="px-2 py-0.5 bg-slate-100 text-slate-700 rounded text-[11px] font-medium border border-slate-200">${staff.system_role || '-'}</span></td>
                        <td class="py-3 px-4">${badge}</td>
                    `;
                    tableBody.appendChild(row);
                });

            } else if (currentView === 'checkins' || currentView === 'ontime' || currentView === 'late') {
                if (currentView === 'checkins') {
                    titleElem.textContent = "All Check-In Logs";
                    subtitleElem.textContent = "Complete chronological history of staff check-in submissions";
                } else if (currentView === 'ontime') {
                    titleElem.textContent = "On-Time Staff Arrivals Today";
                    subtitleElem.textContent = "Staff members who completed check-in on or before 7:30 AM";
                } else if (currentView === 'late') {
                    titleElem.textContent = "Late Staff Arrivals Today";
                    subtitleElem.textContent = "Staff members who completed check-in after 7:30 AM";
                }

                headerRow.innerHTML = `
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Arrival Status</th>
                    <th class="py-3 px-4">Date</th>
                    <th class="py-3 px-4">Exact Time</th>
                `;

                let logs = cachedAttendances.filter(r => r.status === 'check-in');
                
                if (currentView === 'ontime') {
                    logs = logs.filter(r => {
                        if (!r.created_at) return false;
                        const d = new Date(r.created_at);
                        return (d.getHours() * 60 + d.getMinutes()) <= (7 * 60 + 30);
                    });
                } else if (currentView === 'late') {
                    logs = logs.filter(r => {
                        if (!r.created_at) return false;
                        const d = new Date(r.created_at);
                        return (d.getHours() * 60 + d.getMinutes()) > (7 * 60 + 30);
                    });
                }

                if (logs.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400 font-medium">No check-in entries found matching this criterion.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                logs.forEach(record => {
                    const name = staffLookup[record.sdms_id] || 'Unknown Staff';
                    const timeFormatted = record.created_at ? new Date(record.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}) : '-';
                    
                    let statusBadge = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-emerald-50 text-emerald-700 border border-emerald-200">On Time</span>';
                    if (record.created_at) {
                        const checkInDate = new Date(record.created_at);
                        const totalMinutes = checkInDate.getHours() * 60 + checkInDate.getMinutes();
                        if (totalMinutes > (7 * 60 + 30)) {
                            statusBadge = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-rose-50 text-rose-700 border border-rose-200">Late</span>';
                        }
                    }

                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-50/80 transition duration-150';
                    row.innerHTML = `
                        <td class="py-3 px-4 font-mono font-bold text-slate-800">${record.sdms_id || '-'}</td>
                        <td class="py-3 px-4 font-semibold text-slate-900">${name}</td>
                        <td class="py-3 px-4">${statusBadge}</td>
                        <td class="py-3 px-4 text-slate-600 font-mono">${record.date || '-'}</td>
                        <td class="py-3 px-4 text-slate-600 font-mono">${timeFormatted}</td>
                    `;
                    tableBody.appendChild(row);
                });

            } else if (currentView === 'checkouts') {
                titleElem.textContent = "All Check-Out Logs";
                subtitleElem.textContent = "Complete chronological history of staff check-out submissions";
                headerRow.innerHTML = `
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Status Action</th>
                    <th class="py-3 px-4">Date</th>
                    <th class="py-3 px-4">Exact Time</th>
                `;

                const checkoutLogs = cachedAttendances.filter(r => r.status === 'check-out');
                if (checkoutLogs.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400 font-medium">No check-out records found.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                checkoutLogs.forEach(record => {
                    const name = staffLookup[record.sdms_id] || 'Unknown Staff';
                    const timeFormatted = record.created_at ? new Date(record.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}) : '-';
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-50/80 transition duration-150';
                    row.innerHTML = `
                        <td class="py-3 px-4 font-mono font-bold text-slate-800">${record.sdms_id || '-'}</td>
                        <td class="py-3 px-4 font-semibold text-slate-900">${name}</td>
                        <td class="py-3 px-4"><span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-blue-50 text-blue-700 border border-blue-200">Check-Out</span></td>
                        <td class="py-3 px-4 text-slate-600 font-mono">${record.date || '-'}</td>
                        <td class="py-3 px-4 text-slate-600 font-mono">${timeFormatted}</td>
                    `;
                    tableBody.appendChild(row);
                });

            } else if (currentView === 'dailylogs') {
                titleElem.textContent = "Daily Logs By Weekday";
                subtitleElem.textContent = "Grouped day-by-day logs with clear visual separation between different days";
                headerRow.innerHTML = `
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Action Type</th>
                    <th class="py-3 px-4">Date / Weekday</th>
                    <th class="py-3 px-4">Status / Time</th>
                `;

                if (cachedAttendances.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400 font-medium">No attendance logs available.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';

                const groupedByDate = {};
                cachedAttendances.forEach(record => {
                    const recordDateStr = record.date || (record.created_at ? record.created_at.split('T')[0] : 'Unknown Date');
                    if (!groupedByDate[recordDateStr]) {
                        groupedByDate[recordDateStr] = [];
                    }
                    groupedByDate[recordDateStr].push(record);
                });

                const sortedDates = Object.keys(groupedByDate).sort((a, b) => new Date(b) - new Date(a));

                sortedDates.forEach((dateStr, index) => {
                    const dateObj = new Date(dateStr + 'T00:00:00');
                    const weekdayName = !isNaN(dateObj) 
                        ? dateObj.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' }) 
                        : dateStr;

                    const separatorRow = document.createElement('tr');
                    const topMarginClass = index > 0 ? 'border-t-4 border-slate-200' : '';
                    separatorRow.className = `bg-slate-100 font-bold text-slate-900 ${topMarginClass}`;
                    separatorRow.innerHTML = `
                        <td colspan="5" class="py-3 px-4 text-xs uppercase tracking-wider text-blue-950 flex items-center space-x-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span>
                            <span>📅 Date Group: ${weekdayName} (${dateStr})</span>
                        </td>
                    `;
                    tableBody.appendChild(separatorRow);

                    groupedByDate[dateStr].forEach(record => {
                        const name = staffLookup[record.sdms_id] || 'Unknown Staff';
                        const timeFormatted = record.created_at ? new Date(record.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}) : '-';
                        
                        let badge = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-slate-100 text-slate-700 border border-slate-200">-</span>';
                        
                        if (record.status === 'check-in') {
                            if (record.created_at) {
                                const checkInDate = new Date(record.created_at);
                                const totalMinutes = checkInDate.getHours() * 60 + checkInDate.getMinutes();
                                if (totalMinutes > (7 * 60 + 30)) {
                                    badge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-rose-50 text-rose-700 border border-rose-200">Late (${timeFormatted})</span>`;
                                } else {
                                    badge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-emerald-50 text-emerald-700 border border-emerald-200">On Time (${timeFormatted})</span>`;
                                }
                            } else {
                                badge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-emerald-50 text-emerald-700 border border-emerald-200">Check-In</span>`;
                            }
                        } else if (record.status === 'check-out') {
                            badge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-blue-50 text-blue-700 border border-blue-200">Check-Out (${timeFormatted})</span>`;
                        } else {
                            badge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-amber-50 text-amber-800 border border-amber-200">${record.status || 'Unknown'} (${timeFormatted})</span>`;
                        }

                        const row = document.createElement('tr');
                        row.className = 'hover:bg-slate-50/80 transition duration-150';
                        row.innerHTML = `
                            <td class="py-3 px-4 font-mono font-bold text-slate-800">${record.sdms_id || '-'}</td>
                            <td class="py-3 px-4 font-semibold text-slate-900">${name}</td>
                            <td class="py-3 px-4 uppercase text-[11px] font-bold text-slate-700">${record.status || '-'}</td>
                            <td class="py-3 px-4 text-slate-600 font-mono">${record.date || '-'}</td>
                            <td class="py-3 px-4">${badge}</td>
                        `;
                        tableBody.appendChild(row);
                    });
                });

            } else if (currentView === 'leaves') {
                titleElem.textContent = "Staff Leave Requests (Supabase leave_requests)";
                subtitleElem.textContent = "Review leave requests submitted by staff members and approve or reject them directly";
                headerRow.innerHTML = `
                    <th class="py-3 px-4">Request ID</th>
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Leave Date</th>
                    <th class="py-3 px-4">Reason</th>
                    <th class="py-3 px-4">Current Status & Action</th>
                `;

                if (cachedLeaves.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400 font-medium">No leave requests found in 'leave_requests' table.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                cachedLeaves.forEach(req => {
                    const name = staffLookup[req.sdms_id] || 'Unknown Staff';
                    const status = (req.status || 'pending').toLowerCase();
                    const shortId = req.id ? req.id.substring(0, 8) + '...' : '-';
                    
                    let actionHtml = '';
                    if (status === 'approved' || status === 'granted') {
                        actionHtml = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-emerald-50 text-emerald-700 border border-emerald-200">Approved</span>';
                    } else if (status === 'rejected') {
                        actionHtml = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-rose-50 text-rose-700 border border-rose-200">Rejected</span>';
                    } else {
                        actionHtml = `
                            <div class="flex items-center space-x-2">
                                <button onclick="updateLeaveRequestStatus('${req.id}', 'approved')" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded text-[10px] shadow transition">Approve</button>
                                <button onclick="updateLeaveRequestStatus('${req.id}', 'rejected')" class="px-3 py-1 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded text-[10px] shadow transition">Reject</button>
                            </div>
                        `;
                    }

                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-50/80 transition duration-150';
                    row.innerHTML = `
                        <td class="py-3 px-4 font-mono text-slate-400" title="${req.id || ''}">${shortId}</td>
                        <td class="py-3 px-4 font-mono font-bold text-slate-800">${req.sdms_id || '-'}</td>
                        <td class="py-3 px-4 font-semibold text-slate-900">${name}</td>
                        <td class="py-3 px-4 text-slate-600 font-mono">${req.leave_date || '-'}</td>
                        <td class="py-3 px-4 text-slate-700 max-w-xs truncate" title="${req.reason || ''}">${req.reason || '-'}</td>
                        <td class="py-3 px-4">${actionHtml}</td>
                    `;
                    tableBody.appendChild(row);
                });
            }
        }

        async function updateLeaveRequestStatus(requestId, newStatus) {
            try {
                const { error } = await supabaseClient
                    .from('leave_requests')
                    .update({ status: newStatus })
                    .eq('id', requestId);

                if (error) throw error;

                alert(`Leave request successfully ${newStatus}!`);
                loadDashboardData();
            } catch (err) {
                alert(`Error updating leave request status: ${err.message}`);
                console.error(err);
            }
        }

        function exportAttendancePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.text("GS GIKAGATI - OFFICIAL ATTENDANCE REPORT", 14, 20);
            
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text(`Generated on: ${new Date().toLocaleString()}`, 14, 28);
            doc.text("Location: East Province | Nyagatare District | Karama Sector", 14, 34);

            let tableData = [];
            const todayString = new Date().toISOString().split('T')[0];

            const todayMap = {};
            cachedAttendances.forEach(r => {
                if (r.date === todayString && r.sdms_id) {
                    todayMap[r.sdms_id] = r;
                }
            });

            cachedStaff.forEach(staff => {
                const fullName = `${staff.first_name || ''} ${staff.last_name || ''}`.trim() || '-';
                const record = todayMap[staff.sdms_id];
                let statusText = "Pending / Absent";
                
                if (record) {
                    if (record.status === 'check-out') {
                        statusText = "Checked Out";
                    } else if (record.status === 'check-in' && record.created_at) {
                        const checkInDate = new Date(record.created_at);
                        const totalMinutes = checkInDate.getHours() * 60 + checkInDate.getMinutes();
                        if (totalMinutes > (7 * 60 + 30)) {
                            statusText = `Late (${checkInDate.toLocaleTimeString()})`;
                        } else {
                            statusText = `On Time (${checkInDate.toLocaleTimeString()})`;
                        }
                    }
                }

                tableData.push([
                    staff.sdms_id || '-',
                    fullName,
                    staff.position_name || '-',
                    staff.system_role || '-',
                    statusText
                ]);
            });

            doc.autoTable({
                startY: 42,
                head: [['SDMS ID', 'Staff Name', 'Position', 'Role', "Today's Status"]],
                body: tableData,
                theme: 'grid',
                headStyles: { fillColor: [15, 23, 42] },
                styles: { fontSize: 9 }
            });

            doc.save(`GS_Gikagati_Attendance_${todayString}.pdf`);
        }

        function sendOfficialReport() {
            const govEmail = prompt("Enter the official government destination email address:", "sector.karama@nyagatare.gov.rw");
            
            if (govEmail === null) {
                return;
            }

            if (!govEmail.trim() || !govEmail.includes("@") || !govEmail.includes(".")) {
                alert("Operation cancelled or invalid email format provided.");
                return;
            }

            const todayString = new Date().toISOString().split('T')[0];
            let presentCount = 0;
            let lateCount = 0;

            cachedStaff.forEach(staff => {
                const record = cachedAttendances.find(r => r.date === todayString && r.sdms_id === staff.sdms_id && r.status === 'check-in');
                if (record) {
                    presentCount++;
                    const checkInTime = new Date(record.created_at);
                    if ((checkInTime.getHours() * 60 + checkInTime.getMinutes()) > (7 * 60 + 30)) {
                        lateCount++;
                    }
                }
            });

            const absentCount = cachedStaff.length - presentCount;

            const subject = `Official Daily Attendance Report - GS Gikagati (${todayString})`;
            const body = 
                `OFFICIAL DAILY ATTENDANCE REPORT\n` +
                `----------------------------------------\n` +
                `Institution: GS Gikagati\n` +
                `Administrative Location: East Province | Nyagatare District | Karama Sector\n` +
                `Date of Report: ${todayString}\n\n` +
                `ATTENDANCE SUMMARY:\n` +
                `- Total Registered Staff: ${cachedStaff.length}\n` +
                `- Present On Time: ${presentCount - lateCount}\n` +
                `- Late Arrivals (> 07:30 AM): ${lateCount}\n` +
                `- Total Present: ${presentCount}\n` +
                `- Absent / Pending: ${absentCount}\n\n` +
                `----------------------------------------\n` +
                `Submitted via GS Gikagati Master Control Portal\n` +
                `Authorized by Head Teacher: Ladislas`;

            const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(govEmail.trim())}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            window.open(gmailUrl, '_blank');
        }

        function openLeavePermitModal() {
            const selectElem = document.getElementById('leaveStaffSelect');
            selectElem.innerHTML = '<option value="">-- Choose Staff Member --</option>';
            
            cachedStaff.forEach(staff => {
                const fullName = `${staff.first_name || ''} ${staff.last_name || ''}`.trim() || 'Unknown';
                const opt = document.createElement('option');
                opt.value = staff.sdms_id;
                opt.textContent = `${fullName} (SDMS: ${staff.sdms_id})`;
                selectElem.appendChild(opt);
            });

            document.getElementById('leaveStartDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('leaveEndDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('leaveReason').value = '';

            document.getElementById('leaveModal').classList.remove('hidden');
        }

        function closeLeavePermitModal() {
            document.getElementById('leaveModal').classList.add('hidden');
        }

        function generateLeavePermitPDFDirect() {
            const staffId = document.getElementById('leaveStaffSelect').value;
            const startDate = document.getElementById('leaveStartDate').value;
            const endDate = document.getElementById('leaveEndDate').value;
            const reason = document.getElementById('leaveReason').value.trim();

            if (!staffId) {
                alert("Please select a staff member for the leave permit.");
                return;
            }
            if (!startDate || !endDate) {
                alert("Please specify both start and end dates.");
                return;
            }
            if (!reason) {
                alert("Please provide a reason or permit type.");
                return;
            }

            const staffObj = cachedStaff.find(s => s.sdms_id === staffId);
            const staffName = staffObj ? `${staffObj.first_name || ''} ${staffObj.last_name || ''}`.trim() : 'Staff Member';
            const staffPosition = staffObj ? (staffObj.position_name || 'Staff') : 'Staff';

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFillColor(15, 23, 42);
            doc.rect(14, 15, 182, 25, 'F');
            
            doc.setTextColor(255, 255, 255);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.text("GS GIKAGATI - OFFICIAL LEAVE PERMIT", 20, 25);
            
            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.text("Republic of Rwanda | East Province | Nyagatare District | Karama Sector", 20, 33);

            doc.setTextColor(30, 41, 59);
            doc.setFontSize(11);
            doc.setFont("helvetica", "bold");
            doc.text(`CERTIFICATE OF AUTHORIZED LEAVE`, 14, 52);

            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            let y = 62;
            
            const details = [
                `Staff Name: ${staffName}`,
                `SDMS ID: ${staffId}`,
                `Position / Title: ${staffPosition}`,
                `Period of Leave: From ${startDate} To ${endDate}`,
                `Reason / Permit Category: ${reason}`,
                `Date of Issuance: ${new Date().toLocaleDateString()}`
            ];

            details.forEach(line => {
                doc.text(line, 14, y);
                y += 8;
            });

            y += 10;
            doc.setDrawColor(200, 200, 200);
            doc.line(14, y, 196, y);

            y += 15;
            doc.setFont("helvetica", "bold");
            doc.text("AUTHORIZATION & APPROVAL:", 14, y);
            
            y += 8;
            doc.setFont("helvetica", "normal");
            doc.text("This official leave permit has been duly granted and authorized by the Head Teacher.", 14, y);

            y += 25;
            doc.text("____________________________________________", 14, y);
            y += 6;
            doc.setFont("helvetica", "bold");
            doc.text("Ladislas", 14, y);
            y += 5;
            doc.setFont("helvetica", "normal");
            doc.text("Head Teacher, GS Gikagati", 14, y);
            doc.text("Phone: 0788754668", 14, y + 5);

            doc.save(`GS_Gikagati_Leave_Permit_${staffId}.pdf`);
            closeLeavePermitModal();
        }

        window.onload = function() {
            loadDashboardData();
        };
    </script>
</body>
</html>
