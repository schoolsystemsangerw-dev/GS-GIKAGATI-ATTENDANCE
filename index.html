<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS Gikagati - Master Control Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- jsPDF & jsPDF AutoTable for Reports -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-900 antialiased">

    <!-- Dashboard Container -->
    <div class="min-h-screen flex flex-col">
        
        <!-- Header -->
        <header class="bg-slate-900 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
                <div>
                    <h1 class="text-xl font-bold tracking-wide">GS GIKAGATI - MASTER CONTROL PORTAL</h1>
                    <p class="text-xs text-slate-400">East Province | Nyagatare District | Karama Sector</p>
                </div>
                <div class="mt-3 sm:mt-0 flex items-center space-x-3">
                    <button onclick="exportAttendancePDF()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-xs font-bold shadow transition flex items-center space-x-1">
                        <span>📥 Export PDF Report</span>
                    </button>
                    <button onclick="sendOfficialReport()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded text-xs font-bold shadow transition flex items-center space-x-1">
                        <span>✉️ Send via Gmail</span>
                    </button>
                    <button onclick="openLeavePermitModal()" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded text-xs font-bold shadow transition flex items-center space-x-1">
                        <span>📝 Generate Leave Permit</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
            
            <!-- Quick View Filters / Nav -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
                <button onclick="switchView('staff')" id="btn-staff" class="p-4 bg-white rounded-lg shadow-sm border border-slate-200 text-left hover:border-blue-500 transition">
                    <p class="text-xs text-slate-500 uppercase font-bold tracking-wider">Registered Staff</p>
                    <p class="text-2xl font-black text-slate-800 mt-1" id="stat-staff-count">-</p>
                </button>
                <button onclick="switchView('checkins')" id="btn-checkins" class="p-4 bg-white rounded-lg shadow-sm border border-slate-200 text-left hover:border-blue-500 transition">
                    <p class="text-xs text-slate-500 uppercase font-bold tracking-wider">Check-In Logs</p>
                    <p class="text-2xl font-black text-emerald-600 mt-1" id="stat-checkin-count">-</p>
                </button>
                <button onclick="switchView('checkouts')" id="btn-checkouts" class="p-4 bg-white rounded-lg shadow-sm border border-slate-200 text-left hover:border-blue-500 transition">
                    <p class="text-xs text-slate-500 uppercase font-bold tracking-wider">Check-Out Logs</p>
                    <p class="text-2xl font-black text-blue-600 mt-1" id="stat-checkout-count">-</p>
                </button>
                <button onclick="switchView('leaves')" id="btn-leaves" class="p-4 bg-white rounded-lg shadow-sm border border-slate-200 text-left hover:border-blue-500 transition">
                    <p class="text-xs text-slate-500 uppercase font-bold tracking-wider">Leave Requests</p>
                    <p class="text-2xl font-black text-amber-600 mt-1" id="stat-leave-count">-</p>
                </button>
            </div>

            <!-- Table Container -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-50">
                    <div>
                        <h2 class="font-bold text-slate-800 text-lg" id="table-title">Loading Data...</h2>
                        <p class="text-xs text-slate-500" id="table-subtitle">Please wait while records are fetched from Supabase.</p>
                    </div>
                    <div class="mt-2 sm:mt-0">
                        <button onclick="loadDashboardData()" class="px-3 py-1 bg-white border border-slate-300 rounded text-xs font-semibold text-slate-700 hover:bg-slate-100 shadow-sm transition">
                            🔄 Refresh Data
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr id="table-header-row" class="bg-slate-100/70 text-slate-700 text-xs uppercase font-bold tracking-wider border-b border-slate-200">
                                <!-- Dynamic Headers -->
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-slate-200 text-sm">
                            <!-- Dynamic Rows -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- Leave Permit Modal -->
    <div id="leaveModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-200">
            <div class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center">
                <h3 class="font-bold text-base">Generate Official Leave Permit</h3>
                <button onclick="closeLeavePermitModal()" class="text-slate-400 hover:text-white">&times;</button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Select Staff Member</label>
                    <select id="leaveStaffSelect" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500"></select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Start Date</label>
                        <input type="date" id="leaveStartDate" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">End Date</label>
                        <input type="date" id="leaveEndDate" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Reason / Permit Type</label>
                    <input type="text" id="leaveReason" placeholder="e.g., Medical checkup, Official mission" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div class="pt-4 flex justify-end space-x-3">
                    <button onclick="closeLeavePermitModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded text-xs font-bold text-slate-700 transition">Cancel</button>
                    <button onclick="generateLeavePermitPDFDirect()" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 rounded text-xs font-bold text-white shadow transition">Download Permit PDF</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let cachedStaff = [];
        let cachedAttendances = [];
        let cachedLeaves = [];
        let staffLookup = {};
        let currentView = 'staff';

        function switchView(view) {
            currentView = view;
            renderTable();
        }

        async function loadDashboardData() {
            try {
                // Fetch staff
                const { data: staffData, error: staffError } = await supabaseClient.from('staff').select('*');
                if (staffError) throw staffError;
                cachedStaff = staffData || [];

                staffLookup = {};
                cachedStaff.forEach(s => {
                    staffLookup[s.sdms_id] = `${s.first_name || ''} ${s.last_name || ''}`.trim() || 'Unknown Staff';
                });

                // Fetch attendances (including photo_url)
                const { data: attData, error: attError } = await supabaseClient.from('attendances').select('*');
                if (attError) throw attError;
                cachedAttendances = attData || [];

                // Fetch leaves
                const { data: leaveData, error: leaveError } = await supabaseClient.from('leave_requests').select('*');
                if (leaveError) throw leaveError;
                cachedLeaves = leaveData || [];

                // Update counters
                document.getElementById('stat-staff-count').textContent = cachedStaff.length;
                document.getElementById('stat-checkin-count').textContent = cachedAttendances.filter(r => r.status === 'check-in').length;
                document.getElementById('stat-checkout-count').textContent = cachedAttendances.filter(r => r.status === 'check-out').length;
                document.getElementById('stat-leave-count').textContent = cachedLeaves.length;

                renderTable();
            } catch (err) {
                console.error("Error loading dashboard data:", err);
                alert("Failed to load dashboard data. Please check your Supabase credentials.");
            }
        }

        function renderTable() {
            const titleElem = document.getElementById('table-title');
            const subtitleElem = document.getElementById('table-subtitle');
            const headerRow = document.getElementById('table-header-row');
            const tableBody = document.getElementById('table-body');

            if (currentView === 'staff') {
                titleElem.textContent = "Registered Staff Directory";
                subtitleElem.textContent = "Complete roster of registered staff members at GS Gikagati";
                headerRow.innerHTML = `
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Position</th>
                    <th class="py-3 px-4">System Role</th>
                    <th class="py-3 px-4">Status Today</th>
                `;

                if (cachedStaff.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400 font-medium">No staff members registered.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                const todayString = new Date().toISOString().split('T')[0];
                const todayMap = {};
                cachedAttendances.forEach(r => {
                    if (r.date === todayString && r.sdms_id) {
                        todayMap[r.sdms_id] = r;
                    }
                });

                cachedStaff.forEach(staff => {
                    const fullName = `${staff.first_name || ''} ${staff.last_name || ''}`.trim() || '-';
                    const record = todayMap[staff.sdms_id];
                    let badge = '<span class="px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-[11px] font-medium border border-slate-200">Pending</span>';

                    if (record) {
                        if (record.status === 'check-out') {
                            badge = '<span class="px-2 py-0.5 bg-blue-50 text-blue-700 rounded text-[11px] font-medium border border-blue-200">Checked Out</span>';
                        } else if (record.status === 'check-in' && record.created_at) {
                            const checkInDate = new Date(record.created_at);
                            const totalMinutes = checkInDate.getHours() * 60 + checkInDate.getMinutes();
                            if (totalMinutes > (7 * 60 + 30)) {
                                badge = '<span class="px-2 py-0.5 bg-rose-50 text-rose-700 rounded text-[11px] font-medium border border-rose-200">Late</span>';
                            } else {
                                badge = '<span class="px-2 py-0.5 bg-emerald-50 text-emerald-700 rounded text-[11px] font-medium border border-emerald-200">On Time</span>';
                            }
                        }
                    }

                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-50/80 transition duration-150';
                    row.innerHTML = `
                        <td class="py-3 px-4 font-mono font-bold text-slate-800">${staff.sdms_id || '-'}</td>
                        <td class="py-3 px-4 font-semibold text-slate-900">${fullName}</td>
                        <td class="py-3 px-4 text-slate-600">${staff.position_name || '-'}</td>
                        <td class="py-3 px-4"><span class="px-2 py-0.5 bg-slate-100 text-slate-700 rounded text-[11px] font-medium border border-slate-200">${staff.system_role || '-'}</span></td>
                        <td class="py-3 px-4">${badge}</td>
                    `;
                    tableBody.appendChild(row);
                });

            } else if (currentView === 'checkins' || currentView === 'ontime' || currentView === 'late') {
                if (currentView === 'checkins') {
                    titleElem.textContent = "All Check-In Logs";
                    subtitleElem.textContent = "Complete chronological history of staff check-in submissions";
                } else if (currentView === 'ontime') {
                    titleElem.textContent = "On-Time Staff Arrivals Today";
                    subtitleElem.textContent = "Staff members who completed check-in on or before 7:30 AM";
                } else if (currentView === 'late') {
                    titleElem.textContent = "Late Staff Arrivals Today";
                    subtitleElem.textContent = "Staff members who completed check-in after 7:30 AM";
                }

                headerRow.innerHTML = `
                    <th class="py-3 px-4">Photo</th>
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Arrival Status</th>
                    <th class="py-3 px-4">Date</th>
                    <th class="py-3 px-4">Exact Time</th>
                `;

                let logs = cachedAttendances.filter(r => r.status === 'check-in');
                
                if (currentView === 'ontime') {
                    logs = logs.filter(r => {
                        if (!r.created_at) return false;
                        const d = new Date(r.created_at);
                        return (d.getHours() * 60 + d.getMinutes()) <= (7 * 60 + 30);
                    });
                } else if (currentView === 'late') {
                    logs = logs.filter(r => {
                        if (!r.created_at) return false;
                        const d = new Date(r.created_at);
                        return (d.getHours() * 60 + d.getMinutes()) > (7 * 60 + 30);
                    });
                }

                if (logs.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400 font-medium">No check-in entries found matching this criterion.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                logs.forEach(record => {
                    const name = staffLookup[record.sdms_id] || 'Unknown Staff';
                    const timeFormatted = record.created_at ? new Date(record.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}) : '-';
                    
                    let statusBadge = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-emerald-50 text-emerald-700 border border-emerald-200">On Time</span>';
                    if (record.created_at) {
                        const checkInDate = new Date(record.created_at);
                        const totalMinutes = checkInDate.getHours() * 60 + checkInDate.getMinutes();
                        if (totalMinutes > (7 * 60 + 30)) {
                            statusBadge = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-rose-50 text-rose-700 border border-rose-200">Late</span>';
                        }
                    }

                    const photoTag = record.photo_url 
                        ? `<img src="${record.photo_url}" alt="Staff Photo" width="40" height="40" style="border-radius: 50%; object-fit: cover;">` 
                        : `<span style="color: gray; font-size: 12px;">No Photo</span>`;

                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-50/80 transition duration-150';
                    row.innerHTML = `
                        <td class="py-3 px-4">${photoTag}</td>
                        <td class="py-3 px-4 font-mono font-bold text-slate-800">${record.sdms_id || '-'}</td>
                        <td class="py-3 px-4 font-semibold text-slate-900">${name}</td>
                        <td class="py-3 px-4">${statusBadge}</td>
                        <td class="py-3 px-4 text-slate-600 font-mono">${record.date || '-'}</td>
                        <td class="py-3 px-4 text-slate-600 font-mono">${timeFormatted}</td>
                    `;
                    tableBody.appendChild(row);
                });

            } else if (currentView === 'checkouts') {
                titleElem.textContent = "All Check-Out Logs";
                subtitleElem.textContent = "Complete chronological history of staff check-out submissions";
                headerRow.innerHTML = `
                    <th class="py-3 px-4">Photo</th>
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Status Action</th>
                    <th class="py-3 px-4">Date</th>
                    <th class="py-3 px-4">Exact Time</th>
                `;

                const checkoutLogs = cachedAttendances.filter(r => r.status === 'check-out');
                if (checkoutLogs.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400 font-medium">No check-out records found.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                checkoutLogs.forEach(record => {
                    const name = staffLookup[record.sdms_id] || 'Unknown Staff';
                    const timeFormatted = record.created_at ? new Date(record.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}) : '-';
                    
                    const photoTag = record.photo_url 
                        ? `<img src="${record.photo_url}" alt="Staff Photo" width="40" height="40" style="border-radius: 50%; object-fit: cover;">` 
                        : `<span style="color: gray; font-size: 12px;">No Photo</span>`;

                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-50/80 transition duration-150';
                    row.innerHTML = `
                        <td class="py-3 px-4">${photoTag}</td>
                        <td class="py-3 px-4 font-mono font-bold text-slate-800">${record.sdms_id || '-'}</td>
                        <td class="py-3 px-4 font-semibold text-slate-900">${name}</td>
                        <td class="py-3 px-4"><span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-blue-50 text-blue-700 border border-blue-200">Check-Out</span></td>
                        <td class="py-3 px-4 text-slate-600 font-mono">${record.date || '-'}</td>
                        <td class="py-3 px-4 text-slate-600 font-mono">${timeFormatted}</td>
                    `;
                    tableBody.appendChild(row);
                });

            } else if (currentView === 'leaves') {
                titleElem.textContent = "Staff Leave Requests";
                subtitleElem.textContent = "Review leave requests submitted by staff members and approve or reject them directly";
                headerRow.innerHTML = `
                    <th class="py-3 px-4">Request ID</th>
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Leave Date</th>
                    <th class="py-3 px-4">Reason</th>
                    <th class="py-3 px-4">Current Status & Action</th>
                `;

                if (cachedLeaves.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400 font-medium">No leave requests found in 'leave_requests' table.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                cachedLeaves.forEach(req => {
                    const name = staffLookup[req.sdms_id] || 'Unknown Staff';
                    const status = (req.status || 'pending').toLowerCase();
                    const shortId = req.id ? req.id.substring(0, 8) + '...' : '-';
                    
                    let actionHtml = '';
                    if (status === 'approved' || status === 'granted') {
                        actionHtml = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-emerald-50 text-emerald-700 border border-emerald-200">Approved</span>';
                    } else if (status === 'rejected') {
                        actionHtml = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-rose-50 text-rose-700 border border-rose-200">Rejected</span>';
                    } else {
                        actionHtml = `
                            <div class="flex items-center space-x-2">
                                <button onclick="updateLeaveRequestStatus('${req.id}', 'approved')" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded text-[10px] shadow transition">Approve</button>
                                <button onclick="updateLeaveRequestStatus('${req.id}', 'rejected')" class="px-3 py-1 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded text-[10px] shadow transition">Reject</button>
                            </div>
                        `;
                    }

                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-50/80 transition duration-150';
                    row.innerHTML = `
                        <td class="py-3 px-4 font-mono text-slate-400" title="${req.id || ''}">${shortId}</td>
                        <td class="py-3 px-4 font-mono font-bold text-slate-800">${req.sdms_id || '-'}</td>
                        <td class="py-3 px-4 font-semibold text-slate-900">${name}</td>
                        <td class="py-3 px-4 text-slate-600 font-mono">${req.leave_date || '-'}</td>
                        <td class="py-3 px-4 text-slate-700 max-w-xs truncate" title="${req.reason || ''}">${req.reason || '-'}</td>
                        <td class="py-3 px-4">${actionHtml}</td>
                    `;
                    tableBody.appendChild(row);
                });
            }
        }

        async function updateLeaveRequestStatus(requestId, newStatus) {
            try {
                const { error } = await supabaseClient
                    .from('leave_requests')
                    .update({ status: newStatus })
                    .eq('id', requestId);

                if (error) throw error;

                alert(`Leave request successfully ${newStatus}!`);
                loadDashboardData();
            } catch (err) {
                alert(`Error updating leave request status: ${err.message}`);
                console.error(err);
            }
        }

        function exportAttendancePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.text("GS GIKAGATI - OFFICIAL ATTENDANCE REPORT", 14, 20);
            
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text(`Generated on: ${new Date().toLocaleString()}`, 14, 28);
            doc.text("Location: East Province | Nyagatare District | Karama Sector", 14, 34);

            let tableData = [];
            const todayString = new Date().toISOString().split('T')[0];

            const todayMap = {};
            cachedAttendances.forEach(r => {
                if (r.date === todayString && r.sdms_id) {
                    todayMap[r.sdms_id] = r;
                }
            });

            cachedStaff.forEach(staff => {
                const fullName = `${staff.first_name || ''} ${staff.last_name || ''}`.trim() || '-';
                const record = todayMap[staff.sdms_id];
                let statusText = "Pending / Absent";
                
                if (record) {
                    if (record.status === 'check-out') {
                        statusText = "Checked Out";
                    } else if (record.status === 'check-in' && record.created_at) {
                        const checkInDate = new Date(record.created_at);
                        const totalMinutes = checkInDate.getHours() * 60 + checkInDate.getMinutes();
                        if (totalMinutes > (7 * 60 + 30)) {
                            statusText = `Late (${checkInDate.toLocaleTimeString()})`;
                        } else {
                            statusText = `On Time (${checkInDate.toLocaleTimeString()})`;
                        }
                    }
                }

                tableData.push([
                    staff.sdms_id || '-',
                    fullName,
                    staff.position_name || '-',
                    staff.system_role || '-',
                    statusText
                ]);
            });

            doc.autoTable({
                startY: 42,
                head: [['SDMS ID', 'Staff Name', 'Position', 'Role', "Today's Status"]],
                body: tableData,
                theme: 'grid',
                headStyles: { fillColor: [15, 23, 42] },
                styles: { fontSize: 9 }
            });

            doc.save(`GS_Gikagati_Attendance_${todayString}.pdf`);
        }

        function sendOfficialReport() {
            const govEmail = prompt("Enter the official government destination email address:", "sector.karama@nyagatare.gov.rw");
            
            if (govEmail === null) return;

            if (!govEmail.trim() || !govEmail.includes("@") || !govEmail.includes(".")) {
                alert("Operation cancelled or invalid email format provided.");
                return;
            }

            const todayString = new Date().toISOString().split('T')[0];
            let presentCount = 0;
            let lateCount = 0;

            cachedStaff.forEach(staff => {
                const record = cachedAttendances.find(r => r.date === todayString && r.sdms_id === staff.sdms_id && r.status === 'check-in');
                if (record) {
                    presentCount++;
                    const checkInTime = new Date(record.created_at);
                    if ((checkInTime.getHours() * 60 + checkInTime.getMinutes()) > (7 * 60 + 30)) {
                        lateCount++;
                    }
                }
            });

            const absentCount = cachedStaff.length - presentCount;

            const subject = `Official Daily Attendance Report - GS Gikagati (${todayString})`;
            const body = 
                `OFFICIAL DAILY ATTENDANCE REPORT\n` +
                `----------------------------------------\n` +
                `Institution: GS Gikagati\n` +
                `Administrative Location: East Province | Nyagatare District | Karama Sector\n` +
                `Date of Report: ${todayString}\n\n` +
                `ATTENDANCE SUMMARY:\n` +
                `- Total Registered Staff: ${cachedStaff.length}\n` +
                `- Present On Time: ${presentCount - lateCount}\n` +
                `- Late Arrivals (> 07:30 AM): ${lateCount}\n` +
                `- Total Present: ${presentCount}\n` +
                `- Absent / Pending: ${absentCount}\n\n` +
                `----------------------------------------\n` +
                `Submitted via GS Gikagati Master Control Portal\n` +
                `Authorized by Head Teacher: Ladislas`;

            const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(govEmail.trim())}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            window.open(gmailUrl, '_blank');
        }

        function openLeavePermitModal() {
            const selectElem = document.getElementById('leaveStaffSelect');
            selectElem.innerHTML = '<option value="">-- Choose Staff Member --</option>';
            
            cachedStaff.forEach(staff => {
                const fullName = `${staff.first_name || ''} ${staff.last_name || ''}`.trim() || 'Unknown';
                const opt = document.createElement('option');
                opt.value = staff.sdms_id;
                opt.textContent = `${fullName} (SDMS: ${staff.sdms_id})`;
                selectElem.appendChild(opt);
            });

            document.getElementById('leaveStartDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('leaveEndDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('leaveReason').value = '';

            document.getElementById('leaveModal').classList.remove('hidden');
        }

        function closeLeavePermitModal() {
            document.getElementById('leaveModal').classList.add('hidden');
        }

        function generateLeavePermitPDFDirect() {
            const staffId = document.getElementById('leaveStaffSelect').value;
            const startDate = document.getElementById('leaveStartDate').value;
            const endDate = document.getElementById('leaveEndDate').value;
            const reason = document.getElementById('leaveReason').value.trim();

            if (!staffId || !startDate || !endDate || !reason) {
                alert("Please fill out all fields before generating the permit.");
                return;
            }

            const staffObj = cachedStaff.find(s => s.sdms_id === staffId);
            const staffName = staffObj ? `${staffObj.first_name || ''} ${staffObj.last_name || ''}`.trim() : 'Staff Member';
            const staffPosition = staffObj ? (staffObj.position_name || 'Staff') : 'Staff';

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFillColor(15, 23, 42);
            doc.rect(14, 15, 182, 25, 'F');
            
            doc.setTextColor(255, 255, 255);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.text("GS GIKAGATI - OFFICIAL LEAVE PERMIT", 20, 25);
            
            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.text("Republic of Rwanda | East Province | Nyagatare District | Karama Sector", 20, 33);

            doc.setTextColor(30, 41, 59);
            doc.setFontSize(11);
            doc.setFont("helvetica", "bold");
            doc.text(`CERTIFICATE OF AUTHORIZED LEAVE`, 14, 52);

            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            let y = 62;
            
            const details = [
                `Staff Name: ${staffName}`,
                `SDMS ID: ${staffId}`,
                `Position / Title: ${staffPosition}`,
                `Period of Leave: From ${startDate} To ${endDate}`,
                `Reason / Permit Category: ${reason}`,
                `Date of Issuance: ${new Date().toLocaleDateString()}`
            ];

            details.forEach(line => {
                doc.text(line, 14, y);
                y += 8;
            });

            y += 10;
            doc.setDrawColor(200, 200, 200);
            doc.line(14, y, 196, y);

            y += 15;
            doc.setFont("helvetica", "bold");
            doc.text("AUTHORIZATION & APPROVAL:", 14, y);
            
            y += 8;
            doc.setFont("helvetica", "normal");
            doc.text("This official leave permit has been duly granted and authorized by the Head Teacher.", 14, y);

            y += 25;
            doc.text("____________________________________________", 14, y);
            y += 6;
            doc.setFont("helvetica", "bold");
            doc.text("Ladislas", 14, y);
            y += 5;
            doc.setFont("helvetica", "normal");
            doc.text("Head Teacher, GS Gikagati", 14, y);
            doc.text("Phone: 0788754668", 14, y + 5);

            doc.save(`GS_Gikagati_Leave_Permit_${staffId}.pdf`);
            closeLeavePermitModal();
        }

        window.onload = function() {
            loadDashboardData();
        };
    </script>
</body>
</html>
