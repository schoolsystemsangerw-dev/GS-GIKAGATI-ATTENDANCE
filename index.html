<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GS Gikagati Attendance System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border border-slate-200">
        <!-- Logo and Title -->
        <div class="text-center mb-8">
            <img src="gikagati.png" alt="GS Gikagati Logo" class="w-20 h-20 mx-auto mb-4 object-contain">
            <h1 class="text-2xl font-bold text-slate-800">GS GIKAGATI</h1>
            <p class="text-sm text-slate-500 mt-1">Teacher Attendance Management System</p>
        </div>

        <!-- Role Selection Form -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Select Your Role / Portal</label>
                <select id="roleSelect" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                    <option value="head-teacher">Head Teacher (Ladislas)</option>
                    <option value="deputy">Deputy (Marie Therese / Jean Marie Vianne)</option>
                    <option value="dos">Director of Studies (DOS)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Access Code / PIN</label>
                <input type="password" id="accessPin" placeholder="Enter security PIN" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
            </div>

            <button type="submit" class="w-full bg-blue-900 text-white py-3 rounded-lg font-semibold hover:bg-blue-800 transition shadow-sm">
                Access Dashboard
            </button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const role = document.getElementById('roleSelect').value;
            
            // Simple routing based on role selection
            if (role === 'head-teacher') {
                window.location.href = 'head-teacher/dashboard.html';
            } else if (role === 'deputy') {
                alert('Deputy dashboard coming up next!');
            } else if (role === 'dos') {
                alert('DOS dashboard coming up next!');
            }
        });
    </script>
</body>
</html>
