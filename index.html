<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS Gikagati - Master Control Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- jsPDF and AutoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
    <!-- Header / Navigation -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-col md:flex-row justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-xl text-white">GS</div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white">GS Gikagati Master Control Portal</h1>
                <p class="text-xs text-slate-400">Republic of Rwanda | East Province | Nyagatare District | Karama Sector</p>
            </div>
        </div>
        <div class="mt-4 md:mt-0 flex items-center space-x-3 flex-wrap gap-2">
            <button onclick="exportAttendancePDF()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg text-xs shadow transition flex items-center space-x-2">
                <span>Export PDF</span>
            </button>
            <button onclick="sendOfficialReport()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg text-xs shadow transition flex items-center space-x-2">
                <span>Send Official Report</span>
            </button>
            <button onclick="openLeavePermitModal()" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white font-semibold rounded-lg text-xs shadow transition flex items-center space-x-2">
                <span>Leave Permit</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
        <!-- View Selector / Tabs -->
        <div class="flex flex-wrap gap-2 mb-6 border-b border-slate-700 pb-4">
            <button onclick="switchView('checkins')" class="px-4 py-2 rounded-lg text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 transition border border-slate-700">All Check-Ins</button>
            <button onclick="switchView('ontime')" class="px-4 py-2 rounded-lg text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 transition border border-slate-700">On Time</button>
            <button onclick="switchView('late')" class="px-4 py-2 rounded-lg text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 transition border border-slate-700">Late Arrivals</button>
            <button onclick="switchView('checkouts')" class="px-4 py-2 rounded-lg text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 transition border border-slate-700">Check-Outs</button>
            <button onclick="switchView('dailylogs')" class="px-4 py-2 rounded-lg text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 transition border border-slate-700">Daily Logs</button>
            <button onclick="switchView('leaves')" class="px-4 py-2 rounded-lg text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 transition border border-slate-700">Leave Requests</button>
        </div>

        <!-- Content Card -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl shadow-xl overflow-hidden">
            <div class="p-6 border-b border-slate-700 flex flex-col md:flex-row justify-between items-start md:items-center">
                <div>
                    <h2 id="viewTitle" class="text-lg font-bold text-white">Loading...</h2>
                    <p id="viewSubtitle" class="text-xs text-slate-400 mt-1">Please wait while data is synchronized from Supabase.</p>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr id="headerRow" class="bg-slate-900/50 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
                            <!-- Dynamic Headers -->
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-700 text-sm text-slate-200">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Leave Permit Modal -->
    <div id="leaveModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-md w-full p-6 shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-2">Generate Official Leave Permit</h3>
            <p class="text-xs text-slate-400 mb-4">Select staff member and define leave duration.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Staff Member</label>
                    <select id="leaveStaffSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500"></select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Start Date</label>
                        <input type="date" id="leaveStartDate" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">End Date</label>
                        <input type="date" id="leaveEndDate" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Reason / Permit Category</label>
                    <textarea id="leaveReason" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="Enter reason for leave..."></textarea>
                </div>
            </div>

            <div class="mt-6 flex justify-end space-x-3">
                <button onclick="closeLeavePermitModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold rounded-lg text-xs transition">Cancel</button>
                <button onclick="generateLeavePermitPDFDirect()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg text-xs transition">Download PDF</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        const SUPABASE_URL = 'https://qjqljvppfhsszvsuhvzo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_b2zYmY5IaM7_quyh3yfQ-A_aACGNTfq';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let cachedStaff = [];
        let cachedAttendances = [];
        let cachedLeaves = [];
        let staffLookup = {};
        let currentView = 'checkins';

        async function loadDashboardData() {
            try {
                const { data: staffData, error: staffError } = await supabaseClient.from('staffs').select('*');
                if (staffError) throw staffError;
                cachedStaff = staffData || [];
                
                staffLookup = {};
                cachedStaff.forEach(s => {
                    staffLookup[s.sdms_id] = `${s.first_name || ''} ${s.last_name || ''}`.trim();
                });

                const { data: attData, error: attError } = await supabaseClient.from('attendances').select('*').order('created_at', { ascending: false });
                if (attError) throw attError;
                cachedAttendances = attData || [];

                const { data: leaveData, error: leaveError } = await supabaseClient.from('leave_requests').select('*').order('created_at', { ascending: false });
                if (leaveError) {
                    console.warn("Could not fetch leave_requests table:", leaveError.message);
                    cachedLeaves = [];
                } else {
                    cachedLeaves = leaveData || [];
                }

                renderView();
            } catch (err) {
                console.error("Error loading dashboard data:", err);
            }
        }

        function switchView(viewName) {
            currentView = viewName;
            renderView();
        }

        function renderView() {
            const titleElem = document.getElementById('viewTitle');
            const subtitleElem = document.getElementById('viewSubtitle');
            const headerRow = document.getElementById('headerRow');
            const tableBody = document.getElementById('tableBody');

            if (currentView === 'checkins' || currentView === 'ontime' || currentView === 'late') {
                if (currentView === 'checkins') {
                    titleElem.textContent = "All Check-In Logs";
                    subtitleElem.textContent = "Complete chronological history of staff check-in submissions with verification photos";
                } else if (currentView === 'ontime') {
                    titleElem.textContent = "On-Time Staff Arrivals Today";
                    subtitleElem.textContent = "Staff members who completed check-in on or before 7:30 AM";
                } else if (currentView === 'late') {
                    titleElem.textContent = "Late Staff Arrivals Today";
                    subtitleElem.textContent = "Staff members who completed check-in after 7:30 AM";
                }

                headerRow.innerHTML = `
                    <th class="py-3 px-4">Photo</th>
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Arrival Status</th>
                    <th class="py-3 px-4">Date</th>
                    <th class="py-3 px-4">Exact Time</th>
                `;

                let logs = cachedAttendances.filter(r => r.status === 'check-in');
                
                if (currentView === 'ontime') {
                    logs = logs.filter(r => {
                        if (!r.created_at) return false;
                        const d = new Date(r.created_at);
                        return (d.getHours() * 60 + d.getMinutes()) <= (7 * 60 + 30);
                    });
                } else if (currentView === 'late') {
                    logs = logs.filter(r => {
                        if (!r.created_at) return false;
                        const d = new Date(r.created_at);
                        return (d.getHours() * 60 + d.getMinutes()) > (7 * 60 + 30);
                    });
                }

                if (logs.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400 font-medium">No check-in entries found matching this criterion.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                logs.forEach(record => {
                    const name = staffLookup[record.sdms_id] || 'Unknown Staff';
                    const timeFormatted = record.created_at ? new Date(record.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}) : '-';
                    
                    let statusBadge = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">On Time</span>';
                    if (record.created_at) {
                        const checkInDate = new Date(record.created_at);
                        const totalMinutes = checkInDate.getHours() * 60 + checkInDate.getMinutes();
                        if (totalMinutes > (7 * 60 + 30)) {
                            statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-rose-500/20 text-rose-300 border border-rose-500/30">Late (${timeFormatted})</span>`;
                        } else {
                            statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">On Time (${timeFormatted})</span>`;
                        }
                    }

                    let photoHtml = '<span class="text-xs text-slate-500 italic">No Photo</span>';
                    if (record.photo_url) {
                        photoHtml = `<a href="${record.photo_url}" target="_blank" title="Click to view full image"><img src="${record.photo_url}" class="w-10 h-10 object-cover rounded-md border border-slate-600 hover:border-amber-400 transition shadow" /></a>`;
                    }

                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-700/50 transition duration-150';
                    row.innerHTML = `
                        <td class="py-3 px-4">${photoHtml}</td>
                        <td class="py-3 px-4 font-mono font-bold text-slate-200">${record.sdms_id || '-'}</td>
                        <td class="py-3 px-4 font-semibold text-white">${name}</td>
                        <td class="py-3 px-4">${statusBadge}</td>
                        <td class="py-3 px-4 text-slate-400 font-mono">${record.date || '-'}</td>
                        <td class="py-3 px-4 text-slate-400 font-mono">${timeFormatted}</td>
                    `;
                    tableBody.appendChild(row);
                });

            } else if (currentView === 'checkouts') {
                titleElem.textContent = "All Check-Out Logs";
                subtitleElem.textContent = "Complete chronological history of staff check-out submissions with verification photos";
                headerRow.innerHTML = `
                    <th class="py-3 px-4">Photo</th>
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Status Action</th>
                    <th class="py-3 px-4">Date</th>
                    <th class="py-3 px-4">Exact Time</th>
                `;

                const checkoutLogs = cachedAttendances.filter(r => r.status === 'check-out');
                if (checkoutLogs.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400 font-medium">No check-out records found.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                checkoutLogs.forEach(record => {
                    const name = staffLookup[record.sdms_id] || 'Unknown Staff';
                    const timeFormatted = record.created_at ? new Date(record.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}) : '-';
                    
                    let photoHtml = '<span class="text-xs text-slate-500 italic">No Photo</span>';
                    if (record.photo_url) {
                        photoHtml = `<a href="${record.photo_url}" target="_blank" title="Click to view full image"><img src="${record.photo_url}" class="w-10 h-10 object-cover rounded-md border border-slate-600 hover:border-amber-400 transition shadow" /></a>`;
                    }

                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-700/50 transition duration-150';
                    row.innerHTML = `
                        <td class="py-3 px-4">${photoHtml}</td>
                        <td class="py-3 px-4 font-mono font-bold text-slate-200">${record.sdms_id || '-'}</td>
                        <td class="py-3 px-4 font-semibold text-white">${name}</td>
                        <td class="py-3 px-4"><span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-blue-500/20 text-blue-300 border border-blue-500/30">Check-Out (${timeFormatted})</span></td>
                        <td class="py-3 px-4 text-slate-400 font-mono">${record.date || '-'}</td>
                        <td class="py-3 px-4 text-slate-400 font-mono">${timeFormatted}</td>
                    `;
                    tableBody.appendChild(row);
                });

            } else if (currentView === 'dailylogs') {
                titleElem.textContent = "Daily Logs By Weekday";
                subtitleElem.textContent = "Grouped day-by-day logs with verification snapshots and clear visual separation";
                headerRow.innerHTML = `
                    <th class="py-3 px-4">Photo</th>
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Action Type</th>
                    <th class="py-3 px-4">Date / Weekday</th>
                    <th class="py-3 px-4">Status / Time</th>
                `;

                if (cachedAttendances.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400 font-medium">No attendance logs available.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                const groupedByDate = {};
                cachedAttendances.forEach(record => {
                    const recordDateStr = record.date || (record.created_at ? record.created_at.split('T')[0] : 'Unknown Date');
                    if (!groupedByDate[recordDateStr]) {
                        groupedByDate[recordDateStr] = [];
                    }
                    groupedByDate[recordDateStr].push(record);
                });

                const sortedDates = Object.keys(groupedByDate).sort((a, b) => new Date(b) - new Date(a));
                sortedDates.forEach((dateStr, index) => {
                    const dateObj = new Date(dateStr + 'T00:00:00');
                    const weekdayName = !isNaN(dateObj) 
                        ? dateObj.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' }) 
                        : dateStr;

                    const separatorRow = document.createElement('tr');
                    const topMarginClass = index > 0 ? 'border-t-4 border-slate-700' : '';
                    separatorRow.className = `bg-slate-700/80 font-bold text-white ${topMarginClass}`;
                    separatorRow.innerHTML = `
                        <td colspan="6" class="py-3 px-4 text-xs uppercase tracking-wider">
                            📅 Date Group: ${weekdayName} (${dateStr})
                        </td>
                    `;
                    tableBody.appendChild(separatorRow);

                    groupedByDate[dateStr].forEach(record => {
                        const name = staffLookup[record.sdms_id] || 'Unknown Staff';
                        const timeFormatted = record.created_at ? new Date(record.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}) : '-';
                        
                        let photoHtml = '<span class="text-xs text-slate-500 italic">No Photo</span>';
                        if (record.photo_url) {
                            photoHtml = `<a href="${record.photo_url}" target="_blank" title="Click to view full image"><img src="${record.photo_url}" class="w-10 h-10 object-cover rounded-md border border-slate-600 hover:border-amber-400 transition shadow" /></a>`;
                        }

                        let badge = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-slate-700 text-slate-300 border border-slate-600">-</span>';
                        if (record.status === 'check-in') {
                            if (record.created_at) {
                                const checkInDate = new Date(record.created_at);
                                const totalMinutes = checkInDate.getHours() * 60 + checkInDate.getMinutes();
                                if (totalMinutes > (7 * 60 + 30)) {
                                    badge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-rose-500/20 text-rose-300 border border-rose-500/30">Late (${timeFormatted})</span>`;
                                } else {
                                    badge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">On Time (${timeFormatted})</span>`;
                                }
                            } else {
                                badge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">Check-In</span>`;
                            }
                        } else if (record.status === 'check-out') {
                            badge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-blue-500/20 text-blue-300 border border-blue-500/30">Check-Out (${timeFormatted})</span>`;
                        }

                        const row = document.createElement('tr');
                        row.className = 'hover:bg-slate-700/50 transition duration-150';
                        row.innerHTML = `
                            <td class="py-3 px-4">${photoHtml}</td>
                            <td class="py-3 px-4 font-mono font-bold text-slate-200">${record.sdms_id || '-'}</td>
                            <td class="py-3 px-4 font-semibold text-white">${name}</td>
                            <td class="py-3 px-4 uppercase text-[11px] font-bold text-slate-300">${record.status || '-'}</td>
                            <td class="py-3 px-4 text-slate-400 font-mono">${record.date || '-'}</td>
                            <td class="py-3 px-4">${badge}</td>
                        `;
                        tableBody.appendChild(row);
                    });
                });

            } else if (currentView === 'leaves') {
                titleElem.textContent = "Staff Leave Requests (Supabase leave_requests)";
                subtitleElem.textContent = "Review leave requests submitted by staff members and approve or reject them directly";
                headerRow.innerHTML = `
                    <th class="py-3 px-4">Request ID</th>
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Leave Date</th>
                    <th class="py-3 px-4">Reason</th>
                    <th class="py-3 px-4">Current Status & Action</th>
                `;

                if (cachedLeaves.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400 font-medium">No leave requests found in 'leave_requests' table.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                cachedLeaves.forEach(req => {
                    const name = staffLookup[req.sdms_id] || 'Unknown Staff';
                    const status = (req.status || 'pending').toLowerCase();
                    const shortId = req.id ? req.id.substring(0, 8) + '...' : '-';
                    
                    let actionHtml = '';
                    if (status === 'approved' || status === 'granted') {
                        actionHtml = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">Approved</span>';
                    } else if (status === 'rejected') {
                        actionHtml = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-rose-500/20 text-rose-300 border border-rose-500/30">Rejected</span>';
                    } else {
                        actionHtml = `
                            <div class="flex items-center space-x-2">
                                <button onclick="updateLeaveRequestStatus('${req.id}', 'approved')" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded text-[10px] shadow transition">Approve</button>
                                <button onclick="updateLeaveRequestStatus('${req.id}', 'rejected')" class="px-3 py-1 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded text-[10px] shadow transition">Reject</button>
                            </div>
                        `;
                    }

                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-700/50 transition duration-150';
                    row.innerHTML = `
                        <td class="py-3 px-4 font-mono text-slate-500" title="${req.id || ''}">${shortId}</td>
                        <td class="py-3 px-4 font-mono font-bold text-slate-200">${req.sdms_id || '-'}</td>
                        <td class="py-3 px-4 font-semibold text-white">${name}</td>
                        <td class="py-3 px-4 text-slate-400 font-mono">${req.leave_date || '-'}</td>
                        <td class="py-3 px-4 text-slate-300 max-w-xs truncate" title="${req.reason || ''}">${req.reason || '-'}</td>
                        <td class="py-3 px-4">${actionHtml}</td>
                    `;
                    tableBody.appendChild(row);
                });
            }
        }

        async function updateLeaveRequestStatus(requestId, newStatus) {
            try {
                const { error } = await supabaseClient
                    .from('leave_requests')
                    .update({ status: newStatus })
                    .eq('id', requestId);

                if (error) throw error;
                alert(`Leave request successfully ${newStatus}!`);
                loadDashboardData();
            } catch (err) {
                alert(`Error updating leave request status: ${err.message}`);
                console.error(err);
            }
        }

        function exportAttendancePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.text("GS GIKAGATI - OFFICIAL ATTENDANCE REPORT", 14, 20);
            
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text(`Generated on: ${new Date().toLocaleString()}`, 14, 28);
            doc.text("Location: East Province | Nyagatare District | Karama Sector", 14, 34);

            let tableData = [];
            const todayString = new Date().toISOString().split('T')[0];
            const todayMap = {};
            cachedAttendances.forEach(r => {
                if (r.date === todayString && r.sdms_id) {
                    todayMap[r.sdms_id] = r;
                }
            });

            cachedStaff.forEach(staff => {
                const fullName = `${staff.first_name || ''} ${staff.last_name || ''}`.trim() || '-';
                const record = todayMap[staff.sdms_id];
                let statusText = "Pending / Absent";
                
                if (record) {
                    if (record.status === 'check-out') {
                        statusText = "Checked Out";
                    } else if (record.status === 'check-in' && record.created_at) {
                        const checkInDate = new Date(record.created_at);
                        const totalMinutes = checkInDate.getHours() * 60 + checkInDate.getMinutes();
                        if (totalMinutes > (7 * 60 + 30)) {
                            statusText = `Late (${checkInDate.toLocaleTimeString()})`;
                        } else {
                            statusText = `On Time (${checkInDate.toLocaleTimeString()})`;
                        }
                    }
                }

                tableData.push([
                    staff.sdms_id || '-',
                    fullName,
                    staff.position_name || '-',
                    staff.system_role || '-',
                    statusText
                ]);
            });

            doc.autoTable({
                startY: 42,
                head: [['SDMS ID', 'Staff Name', 'Position', 'Role', "Today's Status"]],
                body: tableData,
                theme: 'grid',
                headStyles: { fillColor: [15, 23, 42] },
                styles: { fontSize: 9 }
            });

            doc.save(`GS_Gikagati_Attendance_${todayString}.pdf`);
        }

        function sendOfficialReport() {
            const govEmail = prompt("Enter the official government destination email address:", "sector.karama@nyagatare.gov.rw");
            if (govEmail === null) return;

            if (!govEmail.trim() || !govEmail.includes("@") || !govEmail.includes(".")) {
                alert("Operation cancelled or invalid email format provided.");
                return;
            }

            const todayString = new Date().toISOString().split('T')[0];
            let presentCount = 0;
            let lateCount = 0;

            cachedStaff.forEach(staff => {
                const record = cachedAttendances.find(r => r.date === todayString && r.sdms_id === staff.sdms_id && r.status === 'check-in');
                if (record) {
                    presentCount++;
                    const checkInTime = new Date(record.created_at);
                    if ((checkInTime.getHours() * 60 + checkInTime.getMinutes()) > (7 * 60 + 30)) {
                        lateCount++;
                    }
                }
            });

            const absentCount = cachedStaff.length - presentCount;
            const subject = `Official Daily Attendance Report - GS Gikagati (${todayString})`;
            const body = 
                `OFFICIAL DAILY ATTENDANCE REPORT\n` +
                `----------------------------------------\n` +
                `Institution: GS Gikagati\n` +
                `Administrative Location: East Province | Nyagatare District | Karama Sector\n` +
                `Date of Report: ${todayString}\n\n` +
                `ATTENDANCE SUMMARY:\n` +
                `- Total Registered Staff: ${cachedStaff.length}\n` +
                `- Present On Time: ${presentCount - lateCount}\n` +
                `- Late Arrivals (> 07:30 AM): ${lateCount}\n` +
                `- Total Present: ${presentCount}\n` +
                `- Absent / Pending: ${absentCount}\n\n` +
                `----------------------------------------\n` +
                `Submitted via GS Gikagati Master Control Portal\n` +
                `Authorized by Head Teacher: Ladislas`;

            const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(govEmail.trim())}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            window.open(gmailUrl, '_blank');
        }

        function openLeavePermitModal() {
            const selectElem = document.getElementById('leaveStaffSelect');
            selectElem.innerHTML = '<option value="">-- Choose Staff Member --</option>';
            
            cachedStaff.forEach(staff => {
                const fullName = `${staff.first_name || ''} ${staff.last_name || ''}`.trim() || 'Unknown';
                const opt = document.createElement('option');
                opt.value = staff.sdms_id;
                opt.textContent = `${fullName} (SDMS: ${staff.sdms_id})`;
                selectElem.appendChild(opt);
            });

            document.getElementById('leaveStartDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('leaveEndDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('leaveReason').value = '';
            document.getElementById('leaveModal').classList.remove('hidden');
        }

        function closeLeavePermitModal() {
            document.getElementById('leaveModal').classList.add('hidden');
        }

        function generateLeavePermitPDFDirect() {
            const staffId = document.getElementById('leaveStaffSelect').value;
            const startDate = document.getElementById('leaveStartDate').value;
            const endDate = document.getElementById('leaveEndDate').value;
            const reason = document.getElementById('leaveReason').value.trim();

            if (!staffId) { alert("Please select a staff member for the leave permit."); return; }
            if (!startDate || !endDate) { alert("Please specify both start and end dates."); return; }
            if (!reason) { alert("Please provide a reason or permit type."); return; }

            const staffObj = cachedStaff.find(s => s.sdms_id === staffId);
            const staffName = staffObj ? `${staffObj.first_name || ''} ${staffObj.last_name || ''}`.trim() : 'Staff Member';
            const staffPosition = staffObj ? (staffObj.position_name || 'Staff') : 'Staff';

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFillColor(15, 23, 42);
            doc.rect(14, 15, 182, 25, 'F');
            
            doc.setTextColor(255, 255, 255);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.text("GS GIKAGATI - OFFICIAL LEAVE PERMIT", 20, 25);
            
            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.text("Republic of Rwanda | East Province | Nyagatare District | Karama Sector", 20, 33);

            doc.setTextColor(30, 41, 59);
            doc.setFontSize(11);
            doc.setFont("helvetica", "bold");
            doc.text(`CERTIFICATE OF AUTHORIZED LEAVE`, 14, 52);

            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            let y = 62;
            
            const details = [
                `Staff Name: ${staffName}`,
                `SDMS ID: ${staffId}`,
                `Position / Title: ${staffPosition}`,
                `Period of Leave: From ${startDate} To ${endDate}`,
                `Reason / Permit Category: ${reason}`,
                `Date of Issuance: ${new Date().toLocaleDateString()}`
            ];

            details.forEach(line => {
                doc.text(line, 14, y);
                y += 8;
            });

            y += 10;
            doc.setDrawColor(200, 200, 200);
            doc.line(14, y, 196, y);

            y += 15;
            doc.setFont("helvetica", "bold");
            doc.text("AUTHORIZATION & APPROVAL:", 14, y);
            
            y += 8;
            doc.setFont("helvetica", "normal");
            doc.text("This official leave permit has been duly granted and authorized by the Head Teacher.", 14, y);

            y += 25;
            doc.text("____________________________________________", 14, y);
            y += 6;
            doc.setFont("helvetica", "bold");
            doc.text("Ladislas", 14, y);
            y += 5;
            doc.setFont("helvetica", "normal");
            doc.text("Head Teacher, GS Gikagati", 14, y);
            doc.text("Phone: 0788754668", 14, y + 5);

            doc.save(`GS_Gikagati_Leave_Permit_${staffId}.pdf`);
            closeLeavePermitModal();
        }

        window.onload = function() {
            loadDashboardData();
        };
    </script>
</body>
</html>
