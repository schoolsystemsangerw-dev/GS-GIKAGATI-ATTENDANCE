<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS Gikagati - Master Control Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF & autoTable CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased">

    <div class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR -->
        <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between hidden md:flex">
            <div>
                <!-- Brand Header -->
                <div class="p-6 border-b border-slate-100">
                    <h1 class="font-bold text-slate-900 tracking-tight text-base">GS GIKAGATI</h1>
                    <p class="text-xs text-slate-500 font-medium mt-0.5">Master Control Portal</p>
                </div>

                <!-- Navigation Links -->
                <nav class="p-4 space-y-1">
                    <button onclick="switchView('staff')" id="nav-staff" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-slate-700 bg-slate-100 font-semibold transition text-sm">
                        <span class="text-base">👥</span>
                        <span>All Registered Staff</span>
                    </button>
                    <button onclick="switchView('checkins')" id="nav-checkins" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 font-medium transition text-sm">
                        <span class="text-base">📥</span>
                        <span>Check-In Logs</span>
                    </button>
                    <button onclick="switchView('ontime')" id="nav-ontime" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 font-medium transition text-sm">
                        <span class="text-base">🟢</span>
                        <span>On-Time Arrivals</span>
                    </button>
                    <button onclick="switchView('late')" id="nav-late" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 font-medium transition text-sm">
                        <span class="text-base">🔴</span>
                        <span>Late Arrivals</span>
                    </button>
                    <button onclick="switchView('checkouts')" id="nav-checkouts" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 font-medium transition text-sm">
                        <span class="text-base">📤</span>
                        <span>Check-Out Logs</span>
                    </button>
                    <button onclick="switchView('dailylogs')" id="nav-dailylogs" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 font-medium transition text-sm">
                        <span class="text-base">📅</span>
                        <span>Daily Logs By Weekday</span>
                    </button>
                    <button onclick="switchView('leaves')" id="nav-leaves" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 font-medium transition text-sm">
                        <span class="text-base">📋</span>
                        <span>Leave Permissions</span>
                    </button>
                </nav>
            </div>

            <!-- Admin Profile Footnote -->
            <div class="p-4 border-t border-slate-100 bg-slate-50/50">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold text-xs">UL</div>
                    <div>
                        <p class="text-xs font-bold text-slate-900">UWITUZE Ladislas</p>
                        <p class="text-[11px] text-slate-500">Head Teacher</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT CONTAINER -->
        <main class="flex-1 flex flex-col h-screen overflow-y-auto">
            
            <!-- Top Header Action Bar -->
            <header class="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between sticky top-0 z-10 shadow-sm">
                <div>
                    <h2 id="view-title" class="text-xl font-bold text-slate-900">All Registered Staff</h2>
                    <p id="view-subtitle" class="text-xs text-slate-500">Complete registry of administrative, teaching, and support personnel</p>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="exportAttendancePDF()" class="flex items-center space-x-2 bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-xs font-semibold shadow-sm transition">
                        <span>📄 Export PDF Report</span>
                    </button>
                    <button onclick="sendOfficialReport()" class="flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-semibold shadow-sm transition">
                        <span>✉️ Send Sector Report</span>
                    </button>
                </div>
            </header>

            <!-- Data Table Section -->
            <div class="p-8 max-w-7xl mx-auto w-full flex-1">
                <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr id="table-header-row" class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-600 uppercase tracking-wider">
                                    <th class="py-3 px-4">SDMS ID</th>
                                    <th class="py-3 px-4">Staff Name</th>
                                    <th class="py-3 px-4">Position</th>
                                    <th class="py-3 px-4">System Role</th>
                                    <th class="py-3 px-4">Status</th>
                                </tr>
                            </thead>
                            <tbody id="table-body" class="divide-y divide-slate-100 text-sm">
                                <!-- Populated dynamically by JavaScript -->
                                <tr>
                                    <td colspan="5" class="py-8 text-center text-slate-400 font-medium">Loading system records...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        // Supabase Configuration (Update placeholders with your project credentials if needed)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentView = 'staff';
        let cachedStaff = [];
        let cachedAttendances = [];
        let cachedLeaves = [];
        let staffLookup = {};

        // Fetch Data from Supabase
        async function loadDashboardData() {
            try {
                // Fetch Staff
                const { data: staffData, error: staffError } = await supabaseClient.from('staff').select('*');
                if (staffError) throw staffError;
                cachedStaff = staffData || [];

                // Build staff lookup dictionary
                cachedStaff.forEach(s => {
                    const fullName = `${s.first_name || ''} ${s.last_name || ''}`.trim();
                    if (s.sdms_id) {
                        staffLookup[s.sdms_id] = fullName || 'Unknown Staff';
                    }
                });

                // Fetch Attendance Logs
                const { data: attData, error: attError } = await supabaseClient.from('attendance').select('*').order('created_at', { ascending: false });
                if (attError) throw attError;
                cachedAttendances = attData || [];

                // Fetch Leave Requests
                await loadLeaveRequests();

                renderCurrentView();
            } catch (err) {
                console.error("Error loading dashboard data:", err);
            }
        }

        async function loadLeaveRequests() {
            try {
                const { data, error } = await supabaseClient.from('leave_requests').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                cachedLeaves = data || [];
            } catch (err) {
                console.error("Error fetching leave requests:", err);
            }
        }

        // Switch View Handler
        function switchView(viewName) {
            currentView = viewName;
            
            // Update active states on sidebar buttons
            ['staff', 'checkins', 'ontime', 'late', 'checkouts', 'dailylogs', 'leaves'].forEach(v => {
                const btn = document.getElementById(`nav-${v}`);
                if (btn) {
                    if (v === viewName) {
                        btn.className = "w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-slate-700 bg-slate-100 font-semibold transition text-sm";
                    } else {
                        btn.className = "w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 font-medium transition text-sm";
                    }
                }
            });

            renderCurrentView();
        }

        // Head Teacher Action on Leave Permission
        async function updateLeaveStatus(leaveId, newStatus) {
            const confirmationReason = prompt(`Are you sure you want to mark this leave request as ${newStatus.toUpperCase()}? Add an optional note:`, "");
            if (confirmationReason === null) return; // Cancelled

            try {
                const { error } = await supabaseClient
                    .from('leave_requests')
                    .update({ 
                        status: newStatus, 
                        approved_by: 'UWITUZE Ladislas', 
                        approval_note: confirmationReason,
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', leaveId);

                if (error) throw error;
                
                alert(`Leave request successfully ${newStatus}!`);
                await loadLeaveRequests(); 
                renderCurrentView();     
            } catch (err) {
                console.error("Error updating leave status:", err);
                alert("Failed to update leave status. Please try again.");
            }
        }

        // Main Rendering Router
        function renderCurrentView() {
            const titleElem = document.getElementById('view-title');
            const subtitleElem = document.getElementById('view-subtitle');
            const headerRow = document.getElementById('table-header-row');
            const tableBody = document.getElementById('table-body');

            if (currentView === 'staff') {
                titleElem.textContent = "All Registered Staff";
                subtitleElem.textContent = "Complete registry of administrative, teaching, and support personnel";
                headerRow.innerHTML = `
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Position</th>
                    <th class="py-3 px-4">System Role</th>
                    <th class="py-3 px-4">Today's Status</th>
                `;

                if (cachedStaff.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400 font-medium">No registered staff records found.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                const todayString = new Date().toISOString().split('T')[0];
                
                cachedStaff.forEach(staff => {
                    const fullName = `${staff.first_name || ''} ${staff.last_name || ''}`.trim() || '-';
                    const record = cachedAttendances.find(r => r.date === todayString && r.sdms_id === staff.sdms_id);
                    
                    let badge = '<span class="px-2 py-0.5 bg-amber-50 text-amber-700 rounded text-[11px] font-medium border border-amber-200">Pending / Absent</span>';
                    if (record) {
                        if (record.status === 'check-out') {
                            badge = '<span class="px-2 py-0.5 bg-blue-50 text-blue-700 rounded text-[11px] font-medium border border-blue-200">Checked Out</span>';
                        } else if (record.status === 'check-in' && record.created_at) {
                            const checkInDate = new Date(record.created_at);
                            const totalMinutes = checkInDate.getHours() * 60 + checkInDate.getMinutes();
                            if (totalMinutes > (7 * 60 + 30)) {
                                badge = '<span class="px-2 py-0.5 bg-rose-50 text-rose-700 rounded text-[11px] font-medium border border-rose-200">Late Arrival</span>';
                            } else {
                                badge = '<span class="px-2 py-0.5 bg-emerald-50 text-emerald-700 rounded text-[11px] font-medium border border-emerald-200">On Time</span>';
                            }
                        }
                    }

                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-50/80 transition duration-150';
                    row.innerHTML = `
                        <td class="py-3 px-4 font-mono font-bold text-slate-800">${staff.sdms_id || '-'}</td>
                        <td class="py-3 px-4 font-semibold text-slate-900">${fullName}</td>
                        <td class="py-3 px-4 text-slate-600">${staff.position_name || '-'}</td>
                        <td class="py-3 px-4"><span class="px-2 py-0.5 bg-slate-100 text-slate-700 rounded text-[11px] font-medium border border-slate-200">${staff.system_role || '-'}</span></td>
                        <td class="py-3 px-4">${badge}</td>
                    `;
                    tableBody.appendChild(row);
                });

            } else if (currentView === 'checkins' || currentView === 'ontime' || currentView === 'late') {
                if (currentView === 'checkins') {
                    titleElem.textContent = "All Check-In Logs";
                    subtitleElem.textContent = "Complete chronological history of staff check-in submissions";
                } else if (currentView === 'ontime') {
                    titleElem.textContent = "On-Time Staff Arrivals Today";
                    subtitleElem.textContent = "Staff members who completed check-in on or before 7:30 AM";
                } else if (currentView === 'late') {
                    titleElem.textContent = "Late Staff Arrivals Today";
                    subtitleElem.textContent = "Staff members who completed check-in after 7:30 AM";
                }

                headerRow.innerHTML = `
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Arrival Status</th>
                    <th class="py-3 px-4">Date</th>
                    <th class="py-3 px-4">Exact Time</th>
                `;

                let logs = cachedAttendances.filter(r => r.status === 'check-in');
                
                if (currentView === 'ontime') {
                    logs = logs.filter(r => {
                        if (!r.created_at) return false;
                        const d = new Date(r.created_at);
                        return (d.getHours() * 60 + d.getMinutes()) <= (7 * 60 + 30);
                    });
                } else if (currentView === 'late') {
                    logs = logs.filter(r => {
                        if (!r.created_at) return false;
                        const d = new Date(r.created_at);
                        return (d.getHours() * 60 + d.getMinutes()) > (7 * 60 + 30);
                    });
                }

                if (logs.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400 font-medium">No check-in entries found matching this criterion.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                logs.forEach(record => {
                    const name = staffLookup[record.sdms_id] || 'Unknown Staff';
                    const timeFormatted = record.created_at ? new Date(record.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}) : '-';
                    
                    let statusBadge = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-emerald-50 text-emerald-700 border border-emerald-200">On Time</span>';
                    if (record.created_at) {
                        const checkInDate = new Date(record.created_at);
                        const totalMinutes = checkInDate.getHours() * 60 + checkInDate.getMinutes();
                        if (totalMinutes > (7 * 60 + 30)) {
                            statusBadge = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-rose-50 text-rose-700 border border-rose-200">Late</span>';
                        }
                    }

                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-50/80 transition duration-150';
                    row.innerHTML = `
                        <td class="py-3 px-4 font-mono font-bold text-slate-800">${record.sdms_id || '-'}</td>
                        <td class="py-3 px-4 font-semibold text-slate-900">${name}</td>
                        <td class="py-3 px-4">${statusBadge}</td>
                        <td class="py-3 px-4 text-slate-600 font-mono">${record.date || '-'}</td>
                        <td class="py-3 px-4 text-slate-600 font-mono">${timeFormatted}</td>
                    `;
                    tableBody.appendChild(row);
                });

            } else if (currentView === 'checkouts') {
                titleElem.textContent = "All Check-Out Logs";
                subtitleElem.textContent = "Complete chronological history of staff check-out submissions";
                headerRow.innerHTML = `
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Status Action</th>
                    <th class="py-3 px-4">Date</th>
                    <th class="py-3 px-4">Exact Time</th>
                `;

                const checkoutLogs = cachedAttendances.filter(r => r.status === 'check-out');
                if (checkoutLogs.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400 font-medium">No check-out records found.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                checkoutLogs.forEach(record => {
                    const name = staffLookup[record.sdms_id] || 'Unknown Staff';
                    const timeFormatted = record.created_at ? new Date(record.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}) : '-';
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-50/80 transition duration-150';
                    row.innerHTML = `
                        <td class="py-3 px-4 font-mono font-bold text-slate-800">${record.sdms_id || '-'}</td>
                        <td class="py-3 px-4 font-semibold text-slate-900">${name}</td>
                        <td class="py-3 px-4"><span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-blue-50 text-blue-700 border border-blue-200">Check-Out</span></td>
                        <td class="py-3 px-4 text-slate-600 font-mono">${record.date || '-'}</td>
                        <td class="py-3 px-4 text-slate-600 font-mono">${timeFormatted}</td>
                    `;
                    tableBody.appendChild(row);
                });

            } else if (currentView === 'dailylogs') {
                titleElem.textContent = "Daily Logs By Weekday";
                subtitleElem.textContent = "Grouped day-by-day logs with clear visual separation between different days";
                headerRow.innerHTML = `
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Action Type</th>
                    <th class="py-3 px-4">Date / Weekday</th>
                    <th class="py-3 px-4">Status / Time</th>
                `;

                if (cachedAttendances.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400 font-medium">No attendance logs available.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                const groupedByDate = {};
                cachedAttendances.forEach(record => {
                    const recordDateStr = record.date || (record.created_at ? record.created_at.split('T')[0] : 'Unknown Date');
                    if (!groupedByDate[recordDateStr]) {
                        groupedByDate[recordDateStr] = [];
                    }
                    groupedByDate[recordDateStr].push(record);
                });

                const sortedDates = Object.keys(groupedByDate).sort((a, b) => new Date(b) - new Date(a));

                sortedDates.forEach((dateStr, index) => {
                    const dateObj = new Date(dateStr + 'T00:00:00');
                    const weekdayName = !isNaN(dateObj) 
                        ? dateObj.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' }) 
                        : dateStr;

                    const separatorRow = document.createElement('tr');
                    const topMarginClass = index > 0 ? 'border-t-4 border-slate-200' : '';
                    separatorRow.className = `bg-slate-100 font-bold text-slate-900 ${topMarginClass}`;
                    separatorRow.innerHTML = `
                        <td colspan="5" class="py-3 px-4 text-xs uppercase tracking-wider text-blue-950 flex items-center space-x-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span>
                            <span>📅 Date Group: ${weekdayName} (${dateStr})</span>
                        </td>
                    `;
                    tableBody.appendChild(separatorRow);

                    groupedByDate[dateStr].forEach(record => {
                        const name = staffLookup[record.sdms_id] || 'Unknown Staff';
                        const timeFormatted = record.created_at ? new Date(record.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}) : '-';
                        
                        let badge = '<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-slate-100 text-slate-700 border border-slate-200">-</span>';
                        if (record.status === 'check-in') {
                            if (record.created_at) {
                                const checkInDate = new Date(record.created_at);
                                const totalMinutes = checkInDate.getHours() * 60 + checkInDate.getMinutes();
                                if (totalMinutes > (7 * 60 + 30)) {
                                    badge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-rose-50 text-rose-700 border border-rose-200">Late (${timeFormatted})</span>`;
                                } else {
                                    badge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-emerald-50 text-emerald-700 border border-emerald-200">On Time (${timeFormatted})</span>`;
                                }
                            } else {
                                badge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-emerald-50 text-emerald-700 border border-emerald-200">Check-In</span>`;
                            }
                        } else if (record.status === 'check-out') {
                            badge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-blue-50 text-blue-700 border border-blue-200">Check-Out (${timeFormatted})</span>`;
                        } else {
                            badge = `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide uppercase bg-amber-50 text-amber-800 border border-amber-200">${record.status || 'Unknown'} (${timeFormatted})</span>`;
                        }

                        const row = document.createElement('tr');
                        row.className = 'hover:bg-slate-50/80 transition duration-150';
                        row.innerHTML = `
                            <td class="py-3 px-4 font-mono font-bold text-slate-800">${record.sdms_id || '-'}</td>
                            <td class="py-3 px-4 font-semibold text-slate-900">${name}</td>
                            <td class="py-3 px-4 uppercase text-[11px] font-bold text-slate-700">${record.status || '-'}</td>
                            <td class="py-3 px-4 text-slate-600 font-mono">${record.date || '-'}</td>
                            <td class="py-3 px-4">${badge}</td>
                        `;
                        tableBody.appendChild(row);
                    });
                });

            } else if (currentView === 'leaves') {
                titleElem.textContent = "Staff Leave Permissions";
                subtitleElem.textContent = "Review and authorize pending staff leave and absence requests";
                headerRow.innerHTML = `
                    <th class="py-3 px-4">SDMS ID</th>
                    <th class="py-3 px-4">Staff Name</th>
                    <th class="py-3 px-4">Leave Reason / Details</th>
                    <th class="py-3 px-4">Duration</th>
                    <th class="py-3 px-4">Status & Action (Head Teacher)</th>
                `;

                if (cachedLeaves.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400 font-medium">No leave permission requests found.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                cachedLeaves.forEach(leave => {
                    const name = staffLookup[leave.sdms_id] || 'Unknown Staff';
                    
                    let statusBadge = '';
                    if (leave.status === 'approved') {
                        statusBadge = '<span class="px-2.5 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded text-[10px] font-bold uppercase">Approved</span>';
                    } else if (leave.status === 'rejected') {
                        statusBadge = '<span class="px-2.5 py-1 bg-rose-50 text-rose-700 border border-rose-200 rounded text-[10px] font-bold uppercase">Rejected</span>';
                    } else {
                        statusBadge = '<span class="px-2.5 py-1 bg-amber-50 text-amber-700 border border-amber-200 rounded text-[10px] font-bold uppercase">Pending Review</span>';
                    }

                    const actionButtons = `
                        <div class="flex items-center space-x-2">
                            ${leave.status !== 'approved' ? `<button onclick="updateLeaveStatus('${leave.id}', 'approved')" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-xs font-semibold shadow-sm transition">Approve</button>` : ''}
                            ${leave.status !== 'rejected' ? `<button onclick="updateLeaveStatus('${leave.id}', 'rejected')" class="px-3 py-1 bg-rose-600 hover:bg-rose-700 text-white rounded text-xs font-semibold shadow-sm transition">Reject</button>` : ''}
                        </div>
                    `;

                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-50/80 transition duration-150';
                    row.innerHTML = `
                        <td class="py-3 px-4 font-mono font-bold text-slate-800">${leave.sdms_id || '-'}</td>
                        <td class="py-3 px-4 font-semibold text-slate-900">${name}</td>
                        <td class="py-3 px-4 text-slate-600">${leave.reason || '-'}</td>
                        <td class="py-3 px-4 text-slate-600 font-mono text-xs">${leave.start_date || '?'} to ${leave.end_date || '?'}</td>
                        <td class="py-3 px-4">
                            <div class="flex flex-col space-y-2">
                                <div>${statusBadge}</div>
                                <div>${actionButtons}</div>
                            </div>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }
        }

        // Action: Export Attendance to PDF
        function exportAttendancePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.text("GS GIKAGATI - OFFICIAL ATTENDANCE REPORT", 14, 20);
            
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text(`Generated on: ${new Date().toLocaleString()}`, 14, 28);
            doc.text("Location: East Province | Nyagatare District | Karama Sector", 14, 34);

            let tableData = [];
            const todayString = new Date().toISOString().split('T')[0];

            const todayMap = {};
            cachedAttendances.forEach(r => {
                if (r.date === todayString && r.sdms_id) {
                    todayMap[r.sdms_id] = r;
                }
            });

            cachedStaff.forEach(staff => {
                const fullName = `${staff.first_name || ''} ${staff.last_name || ''}`.trim() || '-';
                const record = todayMap[staff.sdms_id];
                let statusText = "Pending / Absent";
                
                if (record) {
                    if (record.status === 'check-out') {
                        statusText = "Checked Out";
                    } else if (record.status === 'check-in' && record.created_at) {
                        const checkInDate = new Date(record.created_at);
                        const totalMinutes = checkInDate.getHours() * 60 + checkInDate.getMinutes();
                        if (totalMinutes > (7 * 60 + 30)) {
                            statusText = `Late (${checkInDate.toLocaleTimeString()})`;
                        } else {
                            statusText = `On Time (${checkInDate.toLocaleTimeString()})`;
                        }
                    }
                }

                tableData.push([
                    staff.sdms_id || '-',
                    fullName,
                    staff.position_name || '-',
                    staff.system_role || '-',
                    statusText
                ]);
            });

            doc.autoTable({
                startY: 42,
                head: [['SDMS ID', 'Staff Name', 'Position', 'Role', "Today's Status"]],
                body: tableData,
                theme: 'grid',
                headStyles: { fillColor: [15, 23, 42] },
                styles: { fontSize: 9 }
            });

            doc.save(`GS_Gikagati_Attendance_${todayString}.pdf`);
        }

        // Action: Official Report Transmission via Gmail Web Direct Compose
        function sendOfficialReport() {
            const govEmail = prompt("Enter the official government destination email address:", "sector.karama@nyagatare.gov.rw");
            
            if (govEmail === null) {
                return;
            }

            if (!govEmail.trim() || !govEmail.includes("@") || !govEmail.includes(".")) {
                alert("Operation cancelled or invalid email format provided.");
                return;
            }

            const todayString = new Date().toISOString().split('T')[0];
            let presentCount = 0;
            let lateCount = 0;

            cachedStaff.forEach(staff => {
                const record = cachedAttendances.find(r => r.date === todayString && r.sdms_id === staff.sdms_id && r.status === 'check-in');
                if (record) {
                    presentCount++;
                    const checkInTime = new Date(record.created_at);
                    if ((checkInTime.getHours() * 60 + checkInTime.getMinutes()) > (7 * 60 + 30)) {
                        lateCount++;
                    }
                }
            });

            const absentCount = cachedStaff.length - presentCount;

            const subject = `Official Daily Attendance Report - GS Gikagati (${todayString})`;
            const body = 
                `OFFICIAL DAILY ATTENDANCE REPORT\n` +
                `----------------------------------------\n` +
                `Institution: GS Gikagati\n` +
                `Administrative Location: East Province | Nyagatare District | Karama Sector\n` +
                `Date of Report: ${todayString}\n\n` +
                `ATTENDANCE SUMMARY:\n` +
                `- Total Registered Staff: ${cachedStaff.length}\n` +
                `- Present On Time: ${presentCount - lateCount}\n` +
                `- Late Arrivals (> 07:30 AM): ${lateCount}\n` +
                `- Total Present: ${presentCount}\n` +
                `- Absent / Pending: ${absentCount}\n\n` +
                `----------------------------------------\n` +
                `Submitted via GS Gikagati Master Control Portal\n` +
                `Authorized by Head Teacher: Ladislas`;

            const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(govEmail.trim())}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            window.open(gmailUrl, '_blank');
        }

        // Initialize dashboard sync on load
        window.onload = function() {
            loadDashboardData();
        };
    </script>
</body>
